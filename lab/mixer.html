<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7ef">
<title>FREI Labor · Kanal-Mixer</title>
<style>
:root{--bg:#f5f7ef;--ink:#1f352d;--muted:#52695e;--primary:#234f3d;--lime:#dceb9d;--surface:#fffef9;--line:#e5e9df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none}
main{max-width:440px;margin:0 auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
.note{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.pbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.pbtn{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:16px;background:var(--primary);color:#fff;padding:12px 14px;font-size:16px;text-align:left}
.pbtn .lbl{flex:1}.pbtn .lbl small{display:block;opacity:.75;font-size:13px;margin-top:2px}
.pbtn .chg{background:var(--lime);color:var(--primary);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
h1{font-size:22px;margin:10px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.list{display:grid;gap:10px}
.card{border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:14px;text-align:left;font-size:17px;color:var(--ink);display:flex;gap:12px;align-items:center}
.card .ic{font-size:26px;width:34px;text-align:center}.card small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.card[disabled]{opacity:.4}
.stage{flex:1;display:flex;flex-direction:column}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num{aspect-ratio:1;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:26px;font-weight:650;color:var(--primary)}
.num.ok{background:var(--lime);color:#7d9a86}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.maze{display:grid;gap:0;touch-action:none;user-select:none;border-radius:12px;overflow:hidden;background:var(--primary);padding:4px}
.mc{aspect-ratio:1;background:var(--surface)}.mc.w{background:var(--primary)}.mc.g{background:var(--lime)}.mc.p{background:var(--surface);position:relative}
.mc.p::after{content:"";position:absolute;inset:18%;border-radius:50%;background:var(--primary)}.mc.t{background:#eef3e6}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;aspect-ratio:1}
.pad{border:0;border-radius:22px;opacity:.55;transition:opacity .1s,transform .1s}.pad.on{opacity:1;transform:scale(.97)}
.big{font-size:20px;text-align:center;margin:14px 0;min-height:28px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:14px;flex-wrap:wrap}
.actions button{flex:1;min-width:30%;padding:15px 8px;border-radius:14px;border:0;font-size:16px;font-weight:600}
.pri{background:var(--primary);color:#fff}.sec{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.sec-h{font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:16px 0 6px}
.pace{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:22px;background:var(--primary);color:#fff;padding:20px;min-height:52dvh}
.pace .t{font-size:46px;font-weight:700;line-height:1.1}.pace .c{font-size:80px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}.pace .s{opacity:.75;margin-top:8px;font-size:16px}
.step{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:26px;line-height:1.3;padding:10px}
.step small{display:block;font-size:16px;color:var(--muted);margin-top:12px}
.tapbig{width:100%;aspect-ratio:1.6;border:0;border-radius:22px;background:var(--lime);color:var(--primary);font-size:64px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(20,40,30,.45);display:none;z-index:20;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-width:440px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.sheet h2{margin:4px 0 10px;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:0;border-radius:999px;padding:10px 14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;color:var(--ink)}
.chip.on{background:var(--primary);color:#fff;box-shadow:none}
.howto{background:var(--surface);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;line-height:1.4}
.warn{font-size:13px;color:#8a5a2b;margin-top:6px}
</style></head>
<body><main>
<div class="note">FREI · LABOR · KANAL-MIXER (nicht Teil der App)</div>
<div class="pbar"><button class="pbtn" id="pbtn"><span id="picon">○</span><span class="lbl"><span id="pname">Nebenbei: nichts</span><small id="phow">Tippe, um etwas Passives zu wählen</small></span><span class="chg">ändern</span></button></div>
<div class="stage" id="stage"></div>
</main>

<div class="sheet" id="sheet"><div class="in">
<h2>Was läuft nebenher?</h2>
<div class="chips" id="groups"></div>
<div class="chips" id="items"></div>
<div class="howto" id="howto">Wähle oben eine Gruppe.</div>
<div id="extra"></div>
<div class="actions"><button class="pri" id="sheetok">Fertig</button></div>
</div></div>

<audio id="audio" loop></audio>
<script>
const $=id=>document.getElementById(id);
/* ---------- PASSIV ---------- */
const PASSIVE={
 none:{ic:'○',name:'Nichts',items:{none:{n:'Nichts nebenher',h:'Nur die aktive Übung.'}}},
 ears:{ic:'👂',name:'Ohren',uses:['ears'],items:{
   music:{n:'Eigene Musik',h:'Wähle unten ein Lied von deinem Handy. Es läuft in Schleife.'},
   noise:{n:'Ruhiges Rauschen',h:'Gleichmäßiges, tiefes Rauschen. Lautstärke am Handy einstellen.'},
   breath:{n:'Atem-Ton',h:'Ein Klang wird lauter (einatmen) und leiser (ausatmen). Einfach mitatmen, nicht hinschauen.'},
   story:{n:'Hörgeschichte',h:'Kommt später – Inhalte müssen erst geprüft werden.',na:1}}},
 hand:{ic:'✋',name:'Freie Hand',uses:['hand2'],items:{
   touch:{n:'Etwas abtasten',h:'Nimm etwas aus der Tasche. Fühl: Wo ist es rau, wo glatt, wo kalt?'},
   squeeze:{n:'Kneten / Ball',h:'Etwas Weiches in die Hand und langsam drücken und loslassen.'},
   coin:{n:'Münze/Stift drehen',h:'Münze oder Stift zwischen den Fingern drehen.'},
   tap:{n:'Finger an Daumen',h:'Zeigefinger, Mittelfinger, Ring, Kleiner – nacheinander an den Daumen. Und zurück.'},
   fist:{n:'Faust & lösen',h:'Faust langsam schließen, kurz halten, ganz öffnen.'}}},
 sit:{ic:'🦵',name:'Füße (sitzend)',uses:['legs'],items:{
   heels:{n:'Fersen heben',h:'Fersen hoch, Zehen bleiben am Boden. Langsam runter.'},
   press:{n:'Füße in den Boden',h:'Beide Füße fest in den Boden drücken, 10 Sek. halten, lösen.'},
   toes:{n:'Zehen krallen',h:'Zehen einkrallen, halten, wieder spreizen.'},
   knees:{n:'Knie zusammendrücken',h:'Knie gegeneinander drücken, 10 Sek., lösen.'},
   legs:{n:'Beine strecken',h:'Abwechselnd ein Bein strecken, kurz halten, absetzen.'}}},
 stand:{ic:'🚶',name:'Stehen/Gehen',uses:['walk'],items:{
   pace:{n:'5 vor, 5 zurück',h:'5 Schritte vor, 5 zurück. Nur wenn der Weg frei ist.'},
   rock:{n:'Auf Zehen wippen',h:'Langsam auf die Zehen, wieder runter.'},
   shift:{n:'Gewicht verlagern',h:'Gewicht langsam von links nach rechts.'}}},
 mouth:{ic:'👄',name:'Mund',uses:['mouth'],items:{
   water:{n:'Wasser schluckweise',h:'Kleine Schlucke Wasser, langsam.'},
   gum:{n:'Kaugummi',h:'Kaugummi kauen, bewusst langsam.'}}}
};
let pg='none',pi='none';
/* ---------- AKTIV ---------- */
const DIRS={achts:'🌿 ACHTSAMKEIT',beweg:'💪 BEWEGUNG · Handy ablegen',denk:'🧠 DENKAUFGABEN',spiel:'🎮 SPIELE'};
const ACTIVE=[
 {id:'stop',dir:'achts',ic:'✋',n:'STOP',d:'4 kurze Schritte · 1 Min.'},
 {id:'sense',dir:'achts',ic:'👁',n:'5-4-3-2-1',d:'Sehen, hören, fühlen · 2 Min.'},
 {id:'body',dir:'achts',ic:'🧍',n:'Körper-Check',d:'Füße bis Gesicht · 1,5 Min.'},
 {id:'count',dir:'achts',ic:'🌬',n:'Atemzüge zählen',d:'Bis 10 · 1–2 Min.'},
 {id:'watch',dir:'achts',ic:'🔍',n:'Craving beobachten',d:'Wo, wie stark, verändert es sich? · 2 Min.'},
 {id:'red',dir:'achts',ic:'🔴',n:'3 Dinge finden',d:'Im Raum suchen · 1 Min.'},
 {id:'press',dir:'beweg',ic:'🤲',n:'Hände drücken',d:'10 Sek. drücken, 10 lösen · 1 Min. (Handgrip-Idee, nicht fachlich geprüft)'},
 {id:'chair',dir:'beweg',ic:'🪑',n:'10× vom Stuhl aufstehen',d:'Im Takt · 1 Min.'},
 {id:'wall',dir:'beweg',ic:'🧱',n:'Liegestütz an der Wand',d:'10× im Takt · 1 Min.'},
 {id:'march',dir:'beweg',ic:'🚶',n:'Auf der Stelle gehen',d:'Oder Treppe · 1 Min.'},
 {id:'shoulder',dir:'beweg',ic:'🔄',n:'Schultern kreisen',d:'Sanft · 1 Min.'},
 {id:'diff',dir:'denk',ic:'👀',n:'Was hat sich verändert?',d:'Bild merken, Änderung finden · 1–2 Min.'},
 {id:'delta',dir:'denk',ic:'⚖️',n:'Welche Änderung zählt?',d:'Nur ein Stein versperrt den Weg · 1–2 Min.'},
 {id:'follow',dir:'denk',ic:'🟢',n:'Folge dem Punkt',d:'Mit den Augen folgen, Weg nachtippen · 1 Min.'},
 {id:'case',dir:'denk',ic:'🕵️',n:'Mini-Fall',d:'Hinweise lesen, Täter finden · 1–2 Min.'},
 {id:'nums',dir:'denk',ic:'🔢',n:'Zahlen tippen',d:'1 bis 16 der Reihe nach'},
 {id:'maze',dir:'spiel',ic:'🌀',n:'Labyrinth',d:'Mit dem Finger zum grünen Feld'},
 {id:'simon',dir:'spiel',ic:'🟩',n:'Muster nachtippen',d:'Farben merken und nachtippen'},
 {id:'ttt',dir:'spiel',ic:'❌',n:'Tic-Tac-Toe',d:'Zug-Spiel · geht auch beim Gehen',turns:1}
];
function blockedReason(a){
  const ears=pg==='ears';
  if(a.dir==='beweg'&&pg!=='none'&&!(ears&&(pi==='music'||pi==='noise')))return 'Hier passt nebenbei nur Musik oder Rauschen';
  if(a.dir==='denk'&&(pg==='stand'||(ears&&pi==='story')))return pg==='stand'?'Nicht beim Gehen':'Nicht mit Hörbuch';
  if(a.dir==='spiel'&&pg==='stand'&&!a.turns)return 'Beim Gehen nur Zug-Spiele';
  return '';
}
/* ---------- Passiv-Sheet ---------- */
function renderPassive(){
  const g=PASSIVE[pg],it=g.items[pi];
  $('picon').textContent=g.ic;$('pname').textContent='Nebenbei: '+(pg==='none'?'nichts':it.n);
  $('phow').textContent=pg==='none'?'Tippe, um etwas Passives zu wählen':it.h;
}
function renderSheet(){
  $('groups').innerHTML='';Object.entries(PASSIVE).forEach(([k,g])=>{const b=document.createElement('button');b.className='chip'+(k===pg?' on':'');b.textContent=g.ic+' '+g.name;
    b.onclick=()=>{pg=k;pi=Object.keys(g.items).find(x=>!g.items[x].na);applyAudio();renderSheet()};$('groups').appendChild(b)});
  const g=PASSIVE[pg];$('items').innerHTML='';
  Object.entries(g.items).forEach(([k,it])=>{const b=document.createElement('button');b.className='chip'+(k===pi?' on':'');b.textContent=it.n;b.disabled=!!it.na;if(it.na)b.style.opacity=.4;
    b.onclick=()=>{pi=k;applyAudio();renderSheet()};$('items').appendChild(b)});
  $('howto').textContent=g.items[pi].h;
  const ex=$('extra');ex.innerHTML='';
  if(pg==='ears'&&pi==='music'){const f=document.createElement('input');f.type='file';f.accept='audio/*';f.style.marginTop='10px';
    f.onchange=()=>{if(f.files[0]){const a=$('audio');a.src=URL.createObjectURL(f.files[0]);a.play().catch(()=>{})}};ex.appendChild(f)}
  if(pg==='stand')ex.innerHTML='<div class="warn">Beim Gehen sind nur Übungen ohne Dauer-Hinschauen frei.</div>';
  renderPassive();
}
$('pbtn').onclick=()=>{renderSheet();$('sheet').style.display='flex'};
$('sheetok').onclick=()=>{$('sheet').style.display='none';showMenu()};
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheetok').onclick()};
/* Audio */
let actx,noiseNode,noiseGain,breathNode;
const ctx=()=>{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume();return actx};
function beep(f=660,ms=160){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+ms/1000);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+ms/1000+.05)}catch(e){}}
function duck(on){$('audio').volume=on?.12:1;if(noiseGain)noiseGain.gain.value=on?.08:.5}
function applyAudio(){
  const a=$('audio');if(!(pg==='ears'&&pi==='music'))a.pause();
  if(pg==='ears'&&pi==='noise'){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(!noiseNode){noiseGain=actx.createGain();noiseGain.gain.value=.5;const len=actx.sampleRate*4,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);let last=0;
      for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2}
      noiseNode=actx.createBufferSource();noiseNode.buffer=buf;noiseNode.loop=true;noiseNode.connect(noiseGain).connect(actx.destination);noiseNode.start()}
    actx.resume()}
  else if(noiseNode){noiseNode.stop();noiseNode=null}
  if(pg==='ears'&&pi==='breath'){if(!breathNode){const c=ctx(),o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
      o.frequency.value=196;g.gain.value=.12;l.frequency.value=1/10;lg.gain.value=.11;l.connect(lg).connect(g.gain);o.connect(g).connect(c.destination);o.start();l.start();breathNode=[o,l]}}
  else if(breathNode){breathNode.forEach(n=>n.stop());breathNode=null}
}
/* ---------- Aktiv: Menü & Runden ---------- */
const stage=$('stage');let cur=null;
function showMenu(){if(typeof clearT==='function')clearT();cur=null;stage.innerHTML='<h1>Was jetzt?</h1><p class="sub">Eine Runde, dann entscheidest du neu.</p><div class="list" id="alist"></div>';
  Object.entries(DIRS).forEach(([dk,dn])=>{const h=document.createElement('div');h.className='sec-h';h.textContent=dn;$('alist').appendChild(h);
  ACTIVE.filter(a=>a.dir===dk).forEach(a=>{const r=blockedReason(a),b=document.createElement('button');b.className='card';b.disabled=!!r;
    b.innerHTML=`<span class="ic">${a.ic}</span><span>${a.n}<small>${r||a.d}</small></span>`;b.onclick=()=>run(a.id);$('alist').appendChild(b)})})}
function endRound(text){const act=document.createElement('div');stage.querySelector('.big').textContent=text;
  act.className='actions';act.innerHTML='<button class="sec" id="e1">Reicht</button><button class="sec" id="e2">Was anderes</button><button class="pri" id="e3">Noch eine Runde</button>';
  stage.appendChild(act);$('e1').onclick=()=>{stage.innerHTML='<div class="big" style="margin:auto">Okay. Gut, dass du hier warst.</div>'};$('e2').onclick=showMenu;$('e3').onclick=()=>run(cur)}
function head(t,s){stage.innerHTML=`<h1>${t}</h1><p class="sub">${s}</p>`}
let timers=[];const clearT=()=>{timers.forEach(clearTimeout);timers=[];duck(false)};
function run(id){clearT();cur=id;({nums,maze,simon,red,ttt,diff,delta,follow,case:caseG,stop,sense,body,count,watch,press,chair,wall,march,shoulder})[id]()}
function steps(list,endText){/* list: [{t,s,sec?}] – sec: auto weiter, sonst Knopf */let i=0;const box=document.createElement('div');box.className='step';stage.appendChild(box);
  const m=document.createElement('div');m.className='big';const act=document.createElement('div');act.className='actions';act.innerHTML='<button class="pri" id="nx">Weiter</button>';stage.appendChild(m);stage.appendChild(act);
  const show=()=>{clearT();if(i>=list.length){act.remove();box.innerHTML='';return endRound(endText)}const st=list[i];if(st.duck)duck(true);
    box.innerHTML=st.t+(st.s?'<small>'+st.s+'</small>':'');if(st.sec)timers.push(setTimeout(()=>{i++;show()},st.sec*1000))};
  $('nx').onclick=()=>{i++;show()};show()}
function pacer(title,seq,rounds,endText){/* seq: [{t,sec}] */const box=document.createElement('div');box.className='pace';box.innerHTML='<div class="t"></div><div class="c"></div><div class="s"></div>';
  stage.appendChild(box);const m=document.createElement('div');m.className='big';stage.appendChild(m);const act=document.createElement('div');act.className='actions';act.innerHTML='<button class="sec" id="pstop">Stopp</button>';stage.appendChild(act);
  let r=0,k=0,left=0;const tick=()=>{if(left<=0){if(k>=seq.length){k=0;r++}if(r>=rounds){act.remove();box.querySelector('.t').textContent='Fertig';box.querySelector('.c').textContent='✓';return endRound(endText)}
      left=seq[k].sec;box.querySelector('.t').textContent=seq[k].t;beep(k%2?440:660);k++}
    box.querySelector('.c').textContent=left;box.querySelector('.s').textContent=rounds>1?('Runde '+(r+1)+' von '+rounds):'';left--;timers.push(setTimeout(tick,1000))};
  $('pstop').onclick=()=>{clearT();showMenu()};tick()}
/* --- Achtsamkeit --- */
function stop(){head('STOP','Vier kleine Schritte.');steps([{t:'<b>S</b>topp.<br>Halte kurz inne.'},{t:'<b>T</b>ief atmen.<br>Einmal langsam ein … und aus.'},{t:'<b>O</b>ffen wahrnehmen.<br>Was spürst du gerade im Körper?'},{t:'<b>P</b>lan.<br>Was machst du als Nächstes?'}],'Gut gemacht.')}
function sense(){head('5-4-3-2-1','Tippe weiter, wenn du soweit bist.');steps([{t:'Finde <b>5 Dinge</b>, die du siehst.'},{t:'Finde <b>4 Dinge</b>, die du hörst.',s:'Die Musik ist kurz leiser.',duck:1},{t:'Finde <b>3 Dinge</b>, die du fühlst.',s:'Stoff, Boden, Luft …'},{t:'Finde <b>2 Dinge</b>, die du riechst.'},{t:'Finde <b>1 Ding</b>, das du schmeckst.'}],'Wieder ganz da.')}
function body(){head('Körper-Check','Wandert von allein weiter. Augen dürfen zu.');steps([{t:'Spür deine <b>Füße</b>.',sec:15},{t:'Deine <b>Beine</b>.',sec:15},{t:'Deine <b>Hände</b>.',sec:15},{t:'Deine <b>Schultern</b>.<br>Lass sie sinken.',sec:15},{t:'Dein <b>Gesicht</b>.<br>Kiefer locker.',sec:15},{t:'Und dein <b>Atem</b>.',sec:15}],'Fertig.')}
function count(){head('Atemzüge zählen','Tippe bei jedem Ausatmen.');let n=0;const b=document.createElement('button');b.className='tapbig';b.textContent='0';stage.appendChild(b);const m=document.createElement('div');m.className='big';stage.appendChild(m);
  b.onclick=()=>{if(n>=10)return;b.textContent=++n;if(n===10){b.disabled=true;endRound('Zehn ruhige Atemzüge.')}}}
function watch(){head('Craving beobachten','Nur hinschauen. Nichts wegmachen.');
  const q=(t,opts,cb)=>{const w=document.createElement('div');w.innerHTML='<div class="step" style="flex:none;font-size:22px">'+t+'</div>';const c=document.createElement('div');c.className='chips';c.style.justifyContent='center';
    opts.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{w.remove();cb(o)};c.appendChild(b)});w.appendChild(c);stage.appendChild(w)};
  q('Wo spürst du es?',['Brust','Bauch','Mund','Hände','Kopf','Weiß nicht'],()=>q('Wie stark gerade?',['schwach','mittel','stark'],()=>{
    const w=document.createElement('div');w.className='step';w.innerHTML='Bleib 30 Sekunden einfach dabei.<br>Schau, ob es sich bewegt.<small id="wc">30</small>';stage.appendChild(w);let l=30;
    const t=()=>{if(--l<=0){w.remove();q('Und jetzt?',['schwächer','gleich','stärker'],()=>{const m=document.createElement('div');m.className='big';stage.appendChild(m);endRound('Danke fürs Hinschauen.')});return}$('wc').textContent=l;timers.push(setTimeout(t,1000))};timers.push(setTimeout(t,1000))}))}
/* --- Bewegung --- */
function press(){head('Hände drücken','Handy ablegen. Der Ton sagt dir den Wechsel.');pacer('',[{t:'Drücken',sec:10},{t:'Lösen',sec:10}],3,'Eine Runde geschafft.')}
function chair(){head('Vom Stuhl aufstehen','Handy ablegen. Bei jedem Ton: hoch oder runter.');pacer('',[{t:'Hoch',sec:3},{t:'Hinsetzen',sec:3}],10,'Zehn Mal. Stark.')}
function wall(){head('Liegestütz an der Wand','Hände an die Wand, Schritt zurück. Im Takt.');pacer('',[{t:'Zur Wand',sec:3},{t:'Wegdrücken',sec:3}],10,'Zehn Mal geschafft.')}
function march(){head('Auf der Stelle gehen','Oder Treppe. Handy in die Tasche – der Ton zählt mit.');pacer('',[{t:'Gehen',sec:15},{t:'Weiter',sec:15}],2,'Eine Minute bewegt.')}
function shoulder(){head('Schultern kreisen','Langsam und groß.');pacer('',[{t:'Nach vorne',sec:30},{t:'Nach hinten',sec:30}],1,'Locker.')}
/* Zahlen 1-16 */
function nums(){head('Zahlen tippen','Tippe 1 bis 16 der Reihe nach. Ohne Zeitdruck.');
  const g=document.createElement('div');g.className='grid4';const arr=[...Array(16)].map((_,i)=>i+1).sort(()=>Math.random()-.5);let next=1;
  arr.forEach(n=>{const b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>{if(n===next){b.classList.add('ok');next++;if(next>16)endRound('Geschafft.')}else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}};g.appendChild(b)});
  stage.appendChild(g);const m=document.createElement('div');m.className='big';stage.appendChild(m)}
/* Labyrinth */
function maze(){head('Labyrinth','Zieh den Punkt mit dem Finger zum grünen Feld.');
  const W=9,H=11,cells=Array(W*H).fill(1),idx=(x,y)=>y*W+x;
  (function carve(x,y){cells[idx(x,y)]=0;[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5).forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&cells[idx(nx,ny)]){cells[idx(x+dx/2,y+dy/2)]=0;carve(nx,ny)}})})(1,1);
  const goal=idx(W-2,H-2);let pos=idx(1,1);const el=document.createElement('div');el.className='maze';el.style.gridTemplateColumns=`repeat(${W},1fr)`;
  const draw=()=>{el.innerHTML='';cells.forEach((c,i)=>{const d=document.createElement('div');d.className='mc'+(c?' w':'')+(i===goal?' g':'')+(i===pos?' p':'');d.dataset.i=i;el.appendChild(d)})};draw();
  let done=false;const tryMove=t=>{if(done||!t||t.dataset.i===undefined)return;const i=+t.dataset.i,dx=Math.abs(i%W-pos%W),dy=Math.abs(((i/W)|0)-((pos/W)|0));
    if(!cells[i]&&dx+dy===1){pos=i;draw();if(pos===goal){done=true;endRound('Angekommen.')}}};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);tryMove(document.elementFromPoint(e.clientX,e.clientY))});
  el.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')tryMove(document.elementFromPoint(e.clientX,e.clientY))});
  stage.appendChild(el);const m=document.createElement('div');m.className='big';stage.appendChild(m)}

function simon(){head('Muster nachtippen','Schau zu, dann tippe die Farben in derselben Reihenfolge.');
  const cols=['#3f8f6b','#d9b44a','#c96a5a','#5a7fc9'],box=document.createElement('div');box.className='simon';const pads=cols.map((c,i)=>{const b=document.createElement('button');b.className='pad';b.style.background=c;box.appendChild(b);return b});
  stage.appendChild(box);const m=document.createElement('div');m.className='big';stage.appendChild(m);
  let seq=[],inp=0,lock=true,len=3;const flash=(i,ms=420)=>new Promise(r=>{pads[i].classList.add('on');setTimeout(()=>{pads[i].classList.remove('on');setTimeout(r,180)},ms)});
  const show=async()=>{lock=true;m.textContent='Schau zu …';await new Promise(r=>setTimeout(r,500));for(const i of seq)await flash(i);m.textContent='Du bist dran.';inp=0;lock=false};
  const newSeq=()=>{seq=[...Array(len)].map(()=>Math.floor(Math.random()*4));show()};
  pads.forEach((p,i)=>p.onclick=async()=>{if(lock)return;flash(i,200);if(i!==seq[inp]){lock=true;m.textContent='Fast. Nochmal dasselbe.';setTimeout(show,900);return}
    if(++inp===seq.length){lock=true;if(len>=5){endRound('Schön gemerkt.')}else{len++;m.textContent='Gut. Eins mehr.';setTimeout(newSeq,800)}}});
  newSeq()}

function red(){const colors=['rote','blaue','grüne','runde','eckige'];const c=colors[Math.floor(Math.random()*colors.length)];
  head(`3 ${c} Dinge`,'Leg das Handy kurz weg. Schau dich um und finde drei.');

/* ===== DENKAUFGABEN (Rätsel-Delta) ===== */
const LV={diff:1,delta:1,follow:1,case:1};const streak={};
function adapt(id,ok){const s=streak[id]||{w:0,l:0};if(ok){s.w++;s.l=0;if(s.w>=2){LV[id]=Math.min(5,LV[id]+1);s.w=0}}else{s.l++;s.w=0;if(s.l>=2){LV[id]=Math.max(1,LV[id]-1);s.l=0}}streak[id]=s}
const R=n=>Math.floor(Math.random()*n),pick=a=>a[R(a.length)],shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function series(id,title,sub,n,one){head(title,sub);const area=document.createElement('div');area.className='stage';stage.appendChild(area);
  const m=document.createElement('div');m.className='big';stage.appendChild(m);let k=0;
  const next=()=>{if(k>=n){area.remove();return endRound('Runde geschafft.')}k++;area.innerHTML='';m.textContent='';one(area,m,ok=>{adapt(id,ok);timers.push(setTimeout(next,ok?900:1600))})};next()}
const css=document.createElement('style');css.textContent=`
.dg{display:grid;gap:6px;width:100%;margin:0 auto}.dc{aspect-ratio:1;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
.dc svg{width:78%;height:78%}.dc.hit{background:var(--lime)}.dc.miss{background:#f3d9cf}.dc.wall{background:var(--primary);box-shadow:none}.dc.s,.dc.z{font-size:22px}
.dc .badge{position:absolute;inset:16%;border-radius:50%;background:#d9b44a;color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.dc.dot::after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--primary)}
.dc.path{background:#e9f1dc}.dc.stone{background:#8a8f86}
.sus{display:grid;gap:8px}.susc{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:12px;font-size:17px;text-align:left;color:var(--ink)}
.susc .an{font-size:34px}.susc .at{font-size:22px;letter-spacing:4px}.clue{background:var(--surface);border-radius:14px;padding:10px 12px;margin:0 0 8px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px}`;document.head.appendChild(css);

/* --- A: Was hat sich verändert? (inkl. Drehen/Spiegeln) --- */
const COLS=['#3f8f6b','#d9b44a','#c96a5a','#5a7fc9'];
const SH={circle:'<circle cx="50" cy="50" r="38"/>',square:'<rect x="14" y="14" width="72" height="72" rx="8"/>',tri:'<polygon points="50,10 90,88 10,88"/>',
  L:'<polygon points="14,10 40,10 40,64 86,64 86,90 14,90"/>',flag:'<polygon points="18,8 34,8 34,40 84,40 70,58 84,76 34,76 34,92 18,92"/>'};
const ASYM=['L','flag'];
const svgOf=o=>`<svg viewBox="0 0 100 100"><g fill="${COLS[o.c]}" transform="rotate(${o.r} 50 50) ${o.m?'translate(100 0) scale(-1 1)':''}">${SH[o.s]}</g></svg>`;
function diff(){series('diff','Was hat sich verändert?','Schau dir das Bild an. Gleich ändert sich eine Sache.',3,(area,m,done)=>{
  const L=LV.diff,size=L>=3?4:3,N=Math.min(size*size-2,3+L),cells=shuffle([...Array(size*size).keys()]).slice(0,N);
  const objs={};cells.forEach(i=>{const s=pick(L>=3?Object.keys(SH):['circle','square','tri','L']);objs[i]={s,c:R(4),r:ASYM.includes(s)?pick([0,90,180,270]):0,m:0}});
  const types=['color','shape'];if(L>=2)types.push('move');if(L>=3)types.push('rotate');if(L>=4)types.push('mirror','rotate');
  let t=pick(types),target=pick(cells),after=JSON.parse(JSON.stringify(objs));
  const asymCells=cells.filter(i=>ASYM.includes(objs[i].s));
  if((t==='rotate'||t==='mirror')&&!asymCells.length)t='color';
  if(t==='color')after[target].c=(objs[target].c+1+R(3))%4;
  if(t==='shape')after[target].s=pick(Object.keys(SH).filter(x=>x!==objs[target].s&&!ASYM.includes(x))),after[target].r=0;
  if(t==='rotate'){target=pick(asymCells);after[target].r=(objs[target].r+pick([90,180,270]))%360}
  if(t==='mirror'){target=pick(asymCells);after[target].m=1}
  if(t==='move'){const empty=[...Array(size*size).keys()].filter(i=>!(i in objs));const to=pick(empty);after[to]=after[target];delete after[target];target=to}
  const g=document.createElement('div');g.className='dg';g.style.gridTemplateColumns=`repeat(${size},1fr)`;area.appendChild(g);
  const draw=(o,click)=>{g.innerHTML='';for(let i=0;i<size*size;i++){const b=document.createElement('button');b.className='dc';b.dataset.i=i;if(o&&o[i])b.innerHTML=svgOf(o[i]);if(click)b.onclick=()=>click(i,b);g.appendChild(b)}};
  draw(objs);m.textContent='Merk es dir …';const show=Math.max(2200,4200-L*350);
  timers.push(setTimeout(()=>{draw(null);m.textContent=''},show));
  timers.push(setTimeout(()=>{m.textContent='Was ist anders? Tippe es an.';let answered=false;draw(after,(i,b)=>{if(answered)return;answered=true;const ok=i===target;
    b.classList.add(ok?'hit':'miss');if(!ok)g.children[target].classList.add('hit');
    m.textContent=ok?'Genau.':{color:'Die Farbe war anders.',shape:'Die Form war anders.',move:'Das ist neu hierher gewandert.',rotate:'Die Form wurde gedreht.',mirror:'Die Form wurde gespiegelt.'}[t];done(ok)})},show+700))})}

/* --- B: Welche Änderung zählt? (Decision Delta) --- */
function reach(W,H,wall,s,z){const seen=new Set([s]),q=[s];while(q.length){const c=q.shift();if(c===z)return true;const x=c%W,y=(c/W)|0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,n=ny*W+nx;if(nx<0||ny<0||nx>=W||ny>=H||wall.has(n)||seen.has(n))continue;seen.add(n);q.push(n)}}return false}
function shortest(W,H,wall,s,z){const prev={[s]:-1},q=[s];while(q.length){const c=q.shift();if(c===z)break;const x=c%W,y=(c/W)|0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,n=ny*W+nx;if(nx<0||ny<0||nx>=W||ny>=H||wall.has(n)||n in prev)continue;prev[n]=c;q.push(n)}}
  const p=[];if(!(z in prev))return p;for(let c=z;c!==-1;c=prev[c])p.unshift(c);return p}
function delta(){series('delta','Welche Änderung zählt?','Der Punkt 🟢 will zum Ziel 🏁 – nur über helle Felder. Auf eins der Felder 1, 2, 3 kommt ein Stein. Welcher Stein versperrt den Weg?',3,(area,m,done)=>{
  const L=LV.delta,W=L>=3?6:5,H=L>=4?7:6;let wall,s=0,z=W*H-1,cut,decoys;
  for(let tries=0;tries<500;tries++){wall=new Set();for(let i=0;i<W*H;i++)if(i!==s&&i!==z&&Math.random()<0.28+L*0.02)wall.add(i);
    if(!reach(W,H,wall,s,z))continue;const free=[...Array(W*H).keys()].filter(i=>i!==s&&i!==z&&!wall.has(i));
    const cuts=free.filter(i=>!reach(W,H,new Set([...wall,i]),s,z)),non=free.filter(i=>!cuts.includes(i));if(!cuts.length||non.length<2)continue;
    const path=shortest(W,H,wall,s,z),onPath=shuffle(non.filter(i=>path.includes(i))),off=shuffle(non.filter(i=>!path.includes(i)));
    // ab Stufe 2: Täuschungen liegen AUF dem kürzesten Weg – sehen wichtig aus, ändern aber nichts
    if(L>=2&&onPath.length<Math.min(2,L-1))continue;
    cut=pick(cuts);decoys=(L>=2?onPath.concat(off):off.concat(onPath)).slice(0,2);break}
  const opts=shuffle([cut,...decoys]);
  const g=document.createElement('div');g.className='dg';g.style.gridTemplateColumns=`repeat(${W},1fr)`;g.style.gap='4px';area.appendChild(g);
  for(let i=0;i<W*H;i++){const b=document.createElement('button');b.className='dc'+(wall.has(i)?' wall':'');if(i===s)b.textContent='🟢';if(i===z)b.textContent='🏁';
    const k=opts.indexOf(i);if(k>=0){b.innerHTML=`<span class="badge">${k+1}</span>`;b.onclick=()=>answer(i,b)}g.appendChild(b)}
  let answered=false;function answer(i,b){if(answered)return;answered=true;const ok=i===cut;b.classList.add(ok?'hit':'miss');
    g.children[cut].classList.add('stone');g.children[cut].innerHTML='';
    if(!ok){const p=shortest(W,H,new Set([...wall,i]),s,z);p.forEach(c=>{if(c!==s&&c!==z)g.children[c].classList.add('path')})}
    m.textContent=ok?'Genau – ohne dieses Feld gibt es keinen Weg mehr.':`Stein ${opts.indexOf(cut)+1} war es. Um ${opts.indexOf(i)+1} kommt man herum.`;done(ok)}})}

/* --- D+E: Folge dem Punkt --- */
function follow(){series('follow','Folge dem Punkt','Folge dem Punkt mit den Augen. Dann tippst du seinen Weg nach.',3,(area,m,done)=>{
  const L=LV.follow,S=4,len=2+L+(L>=3?1:0),speed=Math.max(380,760-L*70),twist=L>=4;
  const seq=[];while(seq.length<len){const c=R(S*S);if(c!==seq[seq.length-1])seq.push(c)}
  const g=document.createElement('div');g.className='dg';g.style.gridTemplateColumns=`repeat(${S},1fr)`;area.appendChild(g);
  for(let i=0;i<S*S;i++){const b=document.createElement('button');b.className='dc';g.appendChild(b)}
  const play=(sq,cb)=>{let k=0;const step=()=>{[...g.children].forEach(c=>c.classList.remove('dot'));if(k>=sq.length)return timers.push(setTimeout(cb,300));g.children[sq[k]].classList.add('dot');k++;timers.push(setTimeout(step,speed))};step()};
  m.textContent='Schau zu …';
  if(!twist){play(seq,()=>{m.textContent='Jetzt du: tippe den Weg nach.';let k=0,over=false;[...g.children].forEach((b,i)=>b.onclick=()=>{if(over)return;
      if(i===seq[k]){b.classList.add('hit');timers.push(setTimeout(()=>b.classList.remove('hit'),250));if(++k===seq.length){over=true;m.textContent='Genau so.';done(true)}}
      else{over=true;b.classList.add('miss');g.children[seq[k]].classList.add('hit');m.textContent='Hier wäre es weitergegangen.';done(false)}})})}
  else{const wrongAt=1+R(seq.length-1),alt=seq.slice();let c;do{c=R(S*S)}while(c===seq[wrongAt]||c===seq[wrongAt-1]||c===seq[wrongAt+1]);alt[wrongAt]=c;
    play(seq,()=>{m.textContent='Noch einmal – diesmal ist EIN Schritt falsch.';timers.push(setTimeout(()=>play(alt,()=>{m.textContent='Wo war der falsche Schritt? Tippe das Feld.';let over=false;
      [...g.children].forEach((b,i)=>b.onclick=()=>{if(over)return;over=true;const ok=i===c;b.classList.add(ok?'hit':'miss');if(!ok)g.children[c].classList.add('hit');m.textContent=ok?'Erwischt.':'Dieser Schritt war neu.';done(ok)})}),900))})}})}

/* --- G: Mini-Fall --- */
const CASES=['Wer hat den letzten Keks gegessen?','Wer hat die Fernbedienung versteckt?','Wer hat die Pflanze umgeworfen?','Wer hat das Lied auf Dauerschleife gestellt?','Wer hat den Kuchen angeknabbert?','Wer hat die Socken vertauscht?'];
const ANIMALS=['🦊 Fuchs','🐻 Bär','🐸 Frosch','🐼 Panda','🦉 Eule','🐱 Katze'];
const ATTR=[{k:'hut',vals:[['🎩','mit Hut'],['','ohne Hut']]},{k:'farbe',vals:[['🔴','Rot'],['🔵','Blau'],['🟢','Grün']]},{k:'ding',vals:[['☂️','Schirm'],['👜','Tasche'],['','nichts in der Hand']]}];
function clueText(a,v,neg){const t=ATTR[a].vals[v][1];if(a===0)return neg?(v===0?'Der Täter trug keinen Hut.':'Der Täter trug einen Hut.'):(v===0?'Der Täter trug einen Hut.':'Der Täter trug keinen Hut.');
  if(a===1)return neg?`Der Täter trug nichts ${t==='Rot'?'Rotes':t==='Blau'?'Blaues':'Grünes'}.`:`Der Täter trug ${t==='Rot'?'Rot':t==='Blau'?'Blau':'Grün'}.`;
  return neg?(v===2?'Der Täter hatte etwas in der Hand.':`Der Täter hatte keine${v===0?'n Schirm':' Tasche'}.`):(v===2?'Der Täter hatte nichts in der Hand.':`Der Täter hatte ${v===0?'einen Schirm':'eine Tasche'} dabei.`)}
function caseG(){series('case','Mini-Fall','Lies die Hinweise und tippe auf den Täter.',2,(area,m,done)=>{
  const L=LV.case,n=L>=3?4:3,nc=L>=4?3:2;let sus,clues,culprit;
  for(let t=0;t<800;t++){sus=shuffle(ANIMALS.slice()).slice(0,n).map(a=>({a,v:ATTR.map(x=>R(x.vals.length))}));
    const keys=sus.map(s=>s.v.join());if(new Set(keys).size<n)continue;
    const all=[];ATTR.forEach((x,a)=>x.vals.forEach((_,v)=>{all.push({a,v,neg:false});if(L>=2)all.push({a,v,neg:true})}));
    const fits=(s,c)=>c.neg?s.v[c.a]!==c.v:s.v[c.a]===c.v;
    const cand=shuffle(all).filter(c=>{const k=sus.filter(s=>fits(s,c)).length;return k>=1&&k<n});
    let found=null;const combos=k=>{const out=[];const rec=(st,acc)=>{if(acc.length===k){out.push(acc);return}for(let i=st;i<cand.length&&out.length<400;i++)rec(i+1,acc.concat([cand[i]]))};rec(0,[]);return out};
    for(const cs of combos(nc)){const left=sus.filter(s=>cs.every(c=>fits(s,c)));if(left.length!==1)continue;
      const needed=cs.every((_,i)=>sus.filter(s=>cs.filter((__,j)=>j!==i).every(c=>fits(s,c))).length>1);if(needed){found=cs;culprit=left[0];break}}
    if(found){clues=found;break}}
  if(!clues){m.textContent='';return done(true)}
  const q=document.createElement('div');q.innerHTML=`<div class="clue" style="background:var(--lime);box-shadow:none"><b>${pick(CASES)}</b></div>`+clues.map(c=>`<div class="clue">🔎 ${clueText(c.a,c.v,c.neg)}</div>`).join('');area.appendChild(q);
  const list=document.createElement('div');list.className='sus';area.appendChild(list);let over=false;
  sus.forEach(s=>{const b=document.createElement('button');b.className='susc';const icons=s.v.map((v,a)=>ATTR[a].vals[v][0]).join(' ');
    b.innerHTML=`<span class="an">${s.a.split(' ')[0]}</span><span>${s.a.split(' ')[1]}<br><span class="at">${icons}</span></span>`;
    b.onclick=()=>{if(over)return;over=true;const ok=s===culprit;b.style.background=ok?'var(--lime)':'#f3d9cf';m.textContent=ok?'Fall gelöst.':`Es war ${culprit.a.split(' ')[1]}.`;done(ok)};list.appendChild(b)})})}
