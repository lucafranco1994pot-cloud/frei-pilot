<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7ef">
<title>FREI Labor · Kanal-Mixer</title>
<style>
:root{--bg:#f5f7ef;--ink:#1f352d;--muted:#52695e;--primary:#234f3d;--lime:#dceb9d;--surface:#fffef9;--line:#e5e9df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none}
main{max-width:440px;margin:0 auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
.note{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.pbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.pbtn{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:16px;background:var(--primary);color:#fff;padding:12px 14px;font-size:16px;text-align:left}
.pbtn .lbl{flex:1}.pbtn .lbl small{display:block;opacity:.75;font-size:13px;margin-top:2px}
.pbtn .chg{background:var(--lime);color:var(--primary);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
h1{font-size:22px;margin:10px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.list{display:grid;gap:10px}
.card{border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:14px;text-align:left;font-size:17px;color:var(--ink);display:flex;gap:12px;align-items:center}
.card .ic{font-size:26px;width:34px;text-align:center}.card small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.card[disabled]{opacity:.4}
.stage{flex:1;display:flex;flex-direction:column}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num{aspect-ratio:1;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:26px;font-weight:650;color:var(--primary)}
.num.ok{background:var(--lime);color:#7d9a86}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.maze{display:grid;gap:0;touch-action:none;user-select:none;border-radius:12px;overflow:hidden;background:var(--primary);padding:4px}
.mc{aspect-ratio:1;background:var(--surface)}.mc.w{background:var(--primary)}.mc.g{background:var(--lime)}.mc.p{background:var(--surface);position:relative}
.mc.p::after{content:"";position:absolute;inset:18%;border-radius:50%;background:var(--primary)}.mc.t{background:#eef3e6}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;aspect-ratio:1}
.pad{border:0;border-radius:22px;opacity:.55;transition:opacity .1s,transform .1s}.pad.on{opacity:1;transform:scale(.97)}
.big{font-size:20px;text-align:center;margin:14px 0;min-height:28px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:14px;flex-wrap:wrap}
.actions button{flex:1;min-width:30%;padding:15px 8px;border-radius:14px;border:0;font-size:16px;font-weight:600}
.pri{background:var(--primary);color:#fff}.sec{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.sheet{position:fixed;inset:0;background:rgba(20,40,30,.45);display:none;z-index:20;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-width:440px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.sheet h2{margin:4px 0 10px;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:0;border-radius:999px;padding:10px 14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;color:var(--ink)}
.chip.on{background:var(--primary);color:#fff;box-shadow:none}
.howto{background:var(--surface);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;line-height:1.4}
.warn{font-size:13px;color:#8a5a2b;margin-top:6px}
</style></head>
<body><main>
<div class="note">FREI · LABOR · KANAL-MIXER (nicht Teil der App)</div>
<div class="pbar"><button class="pbtn" id="pbtn"><span id="picon">○</span><span class="lbl"><span id="pname">Nebenbei: nichts</span><small id="phow">Tippe, um etwas Passives zu wählen</small></span><span class="chg">ändern</span></button></div>
<div class="stage" id="stage"></div>
</main>

<div class="sheet" id="sheet"><div class="in">
<h2>Was läuft nebenher?</h2>
<div class="chips" id="groups"></div>
<div class="chips" id="items"></div>
<div class="howto" id="howto">Wähle oben eine Gruppe.</div>
<div id="extra"></div>
<div class="actions"><button class="pri" id="sheetok">Fertig</button></div>
</div></div>

<audio id="audio" loop></audio>
<script>
const $=id=>document.getElementById(id);
/* ---------- PASSIV ---------- */
const PASSIVE={
 none:{ic:'○',name:'Nichts',items:{none:{n:'Nichts nebenher',h:'Nur die aktive Übung.'}}},
 ears:{ic:'👂',name:'Ohren',uses:['ears'],items:{
   music:{n:'Eigene Musik',h:'Wähle unten ein Lied von deinem Handy. Es läuft in Schleife.'},
   noise:{n:'Ruhiges Rauschen',h:'Gleichmäßiges, tiefes Rauschen. Lautstärke am Handy einstellen.'},
   story:{n:'Hörgeschichte',h:'Kommt später – Inhalte müssen erst geprüft werden.',na:1}}},
 hand:{ic:'✋',name:'Freie Hand',uses:['hand2'],items:{
   touch:{n:'Etwas abtasten',h:'Nimm etwas aus der Tasche. Fühl: Wo ist es rau, wo glatt, wo kalt?'},
   squeeze:{n:'Kneten / Ball',h:'Etwas Weiches in die Hand und langsam drücken und loslassen.'},
   coin:{n:'Münze/Stift drehen',h:'Münze oder Stift zwischen den Fingern drehen.'},
   tap:{n:'Finger an Daumen',h:'Zeigefinger, Mittelfinger, Ring, Kleiner – nacheinander an den Daumen. Und zurück.'},
   fist:{n:'Faust & lösen',h:'Faust langsam schließen, kurz halten, ganz öffnen.'}}},
 sit:{ic:'🦵',name:'Füße (sitzend)',uses:['legs'],items:{
   heels:{n:'Fersen heben',h:'Fersen hoch, Zehen bleiben am Boden. Langsam runter.'},
   press:{n:'Füße in den Boden',h:'Beide Füße fest in den Boden drücken, 10 Sek. halten, lösen.'},
   toes:{n:'Zehen krallen',h:'Zehen einkrallen, halten, wieder spreizen.'},
   knees:{n:'Knie zusammendrücken',h:'Knie gegeneinander drücken, 10 Sek., lösen.'},
   legs:{n:'Beine strecken',h:'Abwechselnd ein Bein strecken, kurz halten, absetzen.'}}},
 stand:{ic:'🚶',name:'Stehen/Gehen',uses:['walk'],items:{
   pace:{n:'5 vor, 5 zurück',h:'5 Schritte vor, 5 zurück. Nur wenn der Weg frei ist.'},
   rock:{n:'Auf Zehen wippen',h:'Langsam auf die Zehen, wieder runter.'},
   shift:{n:'Gewicht verlagern',h:'Gewicht langsam von links nach rechts.'}}},
 mouth:{ic:'👄',name:'Mund',uses:['mouth'],items:{
   water:{n:'Wasser schluckweise',h:'Kleine Schlucke Wasser, langsam.'},
   gum:{n:'Kaugummi',h:'Kaugummi kauen, bewusst langsam.'}}}
};
let pg='none',pi='none';
/* ---------- AKTIV ---------- */
const ACTIVE=[
 {id:'nums',ic:'🔢',n:'Zahlen tippen',d:'1 bis 16 der Reihe nach',needs:['eyes']},
 {id:'maze',ic:'🌀',n:'Labyrinth',d:'Mit dem Finger zum grünen Feld',needs:['eyes']},
 {id:'simon',ic:'🟩',n:'Muster nachtippen',d:'Farben merken und nachtippen',needs:['eyes','focus']},
 {id:'red',ic:'🔴',n:'3 rote Dinge',d:'Ohne Bildschirm: im Raum suchen',needs:[]},
 {id:'ttt',ic:'❌',n:'Tic-Tac-Toe',d:'Öffnet die Laborseite',needs:['eyes','turns']}
];
function blockedReason(a){
  if(pg==='stand'&&a.needs.includes('eyes')&&!a.needs.includes('turns'))return 'Beim Gehen nicht – zu viel Hinschauen';
  if(pg==='ears'&&pi==='story'&&a.needs.includes('focus'))return 'Nicht mit Hörgeschichte';
  return '';
}
/* ---------- Passiv-Sheet ---------- */
function renderPassive(){
  const g=PASSIVE[pg],it=g.items[pi];
  $('picon').textContent=g.ic;$('pname').textContent='Nebenbei: '+(pg==='none'?'nichts':it.n);
  $('phow').textContent=pg==='none'?'Tippe, um etwas Passives zu wählen':it.h;
}
function renderSheet(){
  $('groups').innerHTML='';Object.entries(PASSIVE).forEach(([k,g])=>{const b=document.createElement('button');b.className='chip'+(k===pg?' on':'');b.textContent=g.ic+' '+g.name;
    b.onclick=()=>{pg=k;pi=Object.keys(g.items).find(x=>!g.items[x].na);applyAudio();renderSheet()};$('groups').appendChild(b)});
  const g=PASSIVE[pg];$('items').innerHTML='';
  Object.entries(g.items).forEach(([k,it])=>{const b=document.createElement('button');b.className='chip'+(k===pi?' on':'');b.textContent=it.n;b.disabled=!!it.na;if(it.na)b.style.opacity=.4;
    b.onclick=()=>{pi=k;applyAudio();renderSheet()};$('items').appendChild(b)});
  $('howto').textContent=g.items[pi].h;
  const ex=$('extra');ex.innerHTML='';
  if(pg==='ears'&&pi==='music'){const f=document.createElement('input');f.type='file';f.accept='audio/*';f.style.marginTop='10px';
    f.onchange=()=>{if(f.files[0]){const a=$('audio');a.src=URL.createObjectURL(f.files[0]);a.play().catch(()=>{})}};ex.appendChild(f)}
  if(pg==='stand')ex.innerHTML='<div class="warn">Beim Gehen sind nur Übungen ohne Dauer-Hinschauen frei.</div>';
  renderPassive();
}
$('pbtn').onclick=()=>{renderSheet();$('sheet').style.display='flex'};
$('sheetok').onclick=()=>{$('sheet').style.display='none';showMenu()};
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheetok').onclick()};
/* Rauschen per WebAudio */
let actx,noiseNode;
function applyAudio(){
  const a=$('audio');if(!(pg==='ears'&&pi==='music'))a.pause();
  if(pg==='ears'&&pi==='noise'){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(!noiseNode){const len=actx.sampleRate*4,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);let last=0;
      for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2}
      noiseNode=actx.createBufferSource();noiseNode.buffer=buf;noiseNode.loop=true;const gn=actx.createGain();gn.gain.value=.5;noiseNode.connect(gn).connect(actx.destination);noiseNode.start()}
    actx.resume()}
  else if(noiseNode){noiseNode.stop();noiseNode=null}
}
/* ---------- Aktiv: Menü & Runden ---------- */
const stage=$('stage');let cur=null;
function showMenu(){cur=null;stage.innerHTML='<h1>Was jetzt?</h1><p class="sub">Eine Runde, dann entscheidest du neu.</p><div class="list" id="alist"></div>';
  ACTIVE.forEach(a=>{const r=blockedReason(a),b=document.createElement('button');b.className='card';b.disabled=!!r;
    b.innerHTML=`<span class="ic">${a.ic}</span><span>${a.n}<small>${r||a.d}</small></span>`;b.onclick=()=>run(a.id);$('alist').appendChild(b)})}
function endRound(text){const act=document.createElement('div');stage.querySelector('.big').textContent=text;
  act.className='actions';act.innerHTML='<button class="sec" id="e1">Reicht</button><button class="sec" id="e2">Was anderes</button><button class="pri" id="e3">Noch eine Runde</button>';
  stage.appendChild(act);$('e1').onclick=()=>{stage.innerHTML='<div class="big" style="margin:auto">Okay. Gut, dass du hier warst.</div>'};$('e2').onclick=showMenu;$('e3').onclick=()=>run(cur)}
function head(t,s){stage.innerHTML=`<h1>${t}</h1><p class="sub">${s}</p>`}
function run(id){cur=id;({nums,maze,simon,red,ttt})[id]()}
/* Zahlen 1-16 */
function nums(){head('Zahlen tippen','Tippe 1 bis 16 der Reihe nach. Ohne Zeitdruck.');
  const g=document.createElement('div');g.className='grid4';const arr=[...Array(16)].map((_,i)=>i+1).sort(()=>Math.random()-.5);let next=1;
  arr.forEach(n=>{const b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>{if(n===next){b.classList.add('ok');next++;if(next>16)endRound('Geschafft.')}else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}};g.appendChild(b)});
  stage.appendChild(g);const m=document.createElement('div');m.className='big';stage.appendChild(m)}
/* Labyrinth */
function maze(){head('Labyrinth','Zieh den Punkt mit dem Finger zum grünen Feld.');
  const W=9,H=11,cells=Array(W*H).fill(1),idx=(x,y)=>y*W+x;
  (function carve(x,y){cells[idx(x,y)]=0;[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5).forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&cells[idx(nx,ny)]){cells[idx(x+dx/2,y+dy/2)]=0;carve(nx,ny)}})})(1,1);
  const goal=idx(W-2,H-2);let pos=idx(1,1);const el=document.createElement('div');el.className='maze';el.style.gridTemplateColumns=`repeat(${W},1fr)`;
  const draw=()=>{el.innerHTML='';cells.forEach((c,i)=>{const d=document.createElement('div');d.className='mc'+(c?' w':'')+(i===goal?' g':'')+(i===pos?' p':'');d.dataset.i=i;el.appendChild(d)})};draw();
  let done=false;const tryMove=t=>{if(done||!t||t.dataset.i===undefined)return;const i=+t.dataset.i,dx=Math.abs(i%W-pos%W),dy=Math.abs(((i/W)|0)-((pos/W)|0));
    if(!cells[i]&&dx+dy===1){pos=i;draw();if(pos===goal){done=true;endRound('Angekommen.')}}};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);tryMove(document.elementFromPoint(e.clientX,e.clientY))});
  el.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')tryMove(document.elementFromPoint(e.clientX,e.clientY))});
  stage.appendChild(el);const m=document.createElement('div');m.className='big';stage.appendChild(m)}
/* Muster nachtippen */
function simon(){head('Muster nachtippen','Schau zu, dann tippe die Farben in derselben Reihenfolge.');
  const cols=['#3f8f6b','#d9b44a','#c96a5a','#5a7fc9'],box=document.createElement('div');box.className='simon';const pads=cols.map((c,i)=>{const b=document.createElement('button');b.className='pad';b.style.background=c;box.appendChild(b);return b});
  stage.appendChild(box);const m=document.createElement('div');m.className='big';stage.appendChild(m);
  let seq=[],inp=0,lock=true,len=3;const flash=(i,ms=420)=>new Promise(r=>{pads[i].classList.add('on');setTimeout(()=>{pads[i].classList.remove('on');setTimeout(r,180)},ms)});
  const show=async()=>{lock=true;m.textContent='Schau zu …';await new Promise(r=>setTimeout(r,500));for(const i of seq)await flash(i);m.textContent='Du bist dran.';inp=0;lock=false};
  const newSeq=()=>{seq=[...Array(len)].map(()=>Math.floor(Math.random()*4));show()};
  pads.forEach((p,i)=>p.onclick=async()=>{if(lock)return;flash(i,200);if(i!==seq[inp]){lock=true;m.textContent='Fast. Nochmal dasselbe.';setTimeout(show,900);return}
    if(++inp===seq.length){lock=true;if(len>=5){endRound('Schön gemerkt.')}else{len++;m.textContent='Gut. Eins mehr.';setTimeout(newSeq,800)}}});
  newSeq()}
/* 3 rote Dinge */
function red(){const colors=['rote','blaue','grüne','runde','eckige'];const c=colors[Math.floor(Math.random()*colors.length)];
  head(`3 ${c} Dinge`,'Leg das Handy kurz weg. Schau dich um und finde drei.');
  const g=document.createElement('div');g.className='list';let n=0;
  [1,2,3].forEach(k=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="ic">○</span><span>Ding ${k}</span>`;b.onclick=()=>{if(b.dataset.ok)return;b.dataset.ok=1;b.querySelector('.ic').textContent='✓';if(++n===3)endRound('Alle drei gefunden.')};g.appendChild(b)});
  stage.appendChild(g);const m=document.createElement('div');m.className='big';stage.appendChild(m)}
function ttt(){location.href='tictactoe.html'}
renderPassive();showMenu();
</script></body></html>
