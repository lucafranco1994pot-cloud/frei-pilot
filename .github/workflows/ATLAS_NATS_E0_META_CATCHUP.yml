          {
            echo 'NATS_COMMIT:'
            git -C nats rev-parse HEAD
            echo 'GO_VERSION:'
            go version
            echo 'TEST_SHA256:'
            sha256sum nats/server/atlas_e0_meta_catchup_test.go
            echo 'PRODUCTION_DIFF:'
            git -C nats diff --exit-code -- . ':!server/atlas_e0_meta_catchup_test.go'
            echo 'WORKTREE_STATUS:'
            git -C nats status --porcelain
          } | tee atlas-e0-inputs.log

      - name: Execute one E0 test with source coverage
        id: e0
        shell: bash
        working-directory: nats
        env:
          ATLAS_E0_EVIDENCE_DIR: ${{ github.workspace }}/atlas-e0-raw
        run: |
          set +e
          set -o pipefail
          go test ./server -run '^TestAtlasE0HealthyMetaSnapshotCatchup$' -count=1 -timeout=18m -coverprofile=../atlas-e0-coverage.out -v 2>&1 | tee ../atlas-e0-test.log
          rc=${PIPESTATUS[0]}
          echo "GO_TEST_EXIT=$rc" | tee -a ../atlas-e0-test.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Audit code-path coverage and exact verdicts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee atlas-e0-path-audit.txt
          from pathlib import Path
          import re
          base=Path('nats/server')
          cov=Path('atlas-e0-coverage.out')
          checks=[
              ('sender', 'raft.go', 'n.sendRPC(subject, n.areply, encoding)'),
              ('receiver', 'raft.go', 'hadPreviousSnapshot := n.snapfile != _EMPTY_'),
              ('meta_apply', 'jetstream_cluster.go', 'streams, err := js.decodeMetaSnapshot(buf)'),
              ('orphan_cleanup', 'jetstream_cluster.go', 'deleteStreams, deleteConsumers := js.getOrphans()'),
          ]
          ranges=[]
          if cov.exists():
              for line in cov.read_text().splitlines()[1:]:
                  m=re.fullmatch(r'(.+?):(\d+)\.(\d+),(\d+)\.(\d+)\s+(\d+)\s+(\d+)',line)
                  if m:
                      ranges.append((m.group(1),int(m.group(2)),int(m.group(4)),int(m.group(7))))
          print('ATLAS_E0_COVERAGE_PRESENT='+str(cov.exists()).lower())
          for label,filename,needle in checks:
              content=(base/filename).read_text().splitlines()
              lines=[j+1 for j,row in enumerate(content) if needle in row]
              if len(lines)!=1:
                  print('ATLAS_E0_PATH=%s classification=BLOCKED_MATCH_COUNT lines=%s'%(label,lines))
                  continue
              target=lines[0]
              counts=[count for path,start,end,count in ranges if path.endswith('/server/'+filename) and start<=target<=end]
              print('ATLAS_E0_PATH=%s line=%d executed=%s coverage_blocks=%s'%(label,target,str(any(n>0 for n in counts)).lower(),counts))
          print('ATLAS_E0_COVERAGE_LIMIT=whole_test_only_not_event_order_or_follower_specific')
          PY
          {
            echo '=== Input hashes ==='; cat atlas-e0-inputs.log 2>/dev/null || true
            echo '=== Test exit ==='; grep 'GO_TEST_EXIT' atlas-e0-test.log 2>/dev/null | tail -n 1 || true
            echo '=== E0 evidence ==='; grep -E 'ATLAS_E0_(VERDICT|TRANSFER_PROOF|FORCED_META_SNAPSHOT|RECEIVER_SNAPSHOT|RECOVERY|API|BEFORE|AFTER|TARGET|LOG_SUMMARY|RESTART|START_RETURNED)' atlas-e0-test.log 2>/dev/null | tail -n 80 || true
            echo '=== Coverage ==='; cat atlas-e0-path-audit.txt
            echo '=== Test summary ==='; grep -E '^--- (PASS|FAIL|SKIP)|^PASS$|^FAIL$|GO_TEST_EXIT' atlas-e0-test.log 2>/dev/null | tail -n 20 || true
          } | tee atlas-e0-summary.txt
          cat atlas-e0-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve original evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e0-healthy-meta-snapshot-evidence
          path: |
            atlas-e0-inputs.log
            atlas-e0-test.log
            atlas-e0-coverage.out
            atlas-e0-path-audit.txt
            atlas-e0-summary.txt
            atlas-e0-gofmt.diff
            atlas-e0-raw/**
            nats/server/atlas_e0_meta_catchup_test.go
          if-no-files-found: warn
          retention-days: 14
