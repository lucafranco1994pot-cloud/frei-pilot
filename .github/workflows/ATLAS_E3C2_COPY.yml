# ATLAS E3C2 compact, test-only. Historical unsupported standalone-to-cluster migration.
# Uses exact archived E3C test; changes only the 1->3 node setup and adds identity checks.
name: ATLAS E3C2 Native Three Node Compact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lucafranco1994pot-cloud/frei-pilot
          ref: 6c8eb91a52e25b2d47c543fa45bf8dd2dd190798
          path: pilot
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nats-io/nats-server
          ref: d163ae747ad050ea89054f8fb03c43e64e737aea
          path: nats
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Rebuild native test from frozen E3C file, verify and narrow changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pilot rev-parse HEAD)" = 6c8eb91a52e25b2d47c543fa45bf8dd2dd190798
          test "$(git -C nats rev-parse HEAD)" = d163ae747ad050ea89054f8fb03c43e64e737aea
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          wf=Path('pilot/.github/workflows/ATLAS_NATS_E3C_NATIVE_ORPHAN_REACHABILITY.yml')
          lines=wf.read_text().splitlines()
          op="cat > nats/server/atlas_e3c_native_orphan_test.go <<'ATLAS_E3C_SOURCE'"
          a=[i for i,l in enumerate(lines) if l.strip()==op]
          assert len(a)==1
          b=[i for i in range(a[0]+1,len(lines)) if lines[i].strip()=='ATLAS_E3C_SOURCE']
          assert len(b)==1
          old='\n'.join(l[10:] if l.startswith('          ') else l for l in lines[a[0]+1:b[0]])+'\n'
          assert hashlib.sha256(old.encode()).hexdigest()=='9933c17e42c6fa6461c3f483e91d16a3c05db1bbf00234f52dd6db4c3959b5cc'
          def patch(before,after):
              global old
              assert old.count(before)==1,repr(before)
              old=old.replace(before,after,1)
          patch('"ATLAS_E3C_NATURAL", 1, modify)', '"ATLAS_E3C_NATURAL", 3, modify)')
          patch('len(c.servers) != 1', 'len(c.servers) != 3')
          patch('oldDir := fs1.fcfg.StoreDir', '''oldDir := fs1.fcfg.StoreDir
          g1Msg, g1Err := g1.getMsg(1)
          if g1Err != nil || g1Msg == nil || string(g1Msg.Data) != "ATLAS_E3C_NATURAL_STANDALONE_G1" {
              t.Fatalf("BLOCKED: G1 identity payload missing: %v", g1Err)
          }
          t.Log("ATLAS_E3C2_G1_PAYLOAD_VERIFIED=true")''')
          patch('t.Log("ATLAS_E3CN_PUBLIC_API_REASSIGNED_ORPHAN_NAME=true")', '''adopted, adoptErr := acc.lookupStream(name)
          js.mu.RLock()
          apiAssignment := js.cluster.streams[acc.Name][name]
          js.mu.RUnlock()
          if adoptErr != nil || adopted != g1 || apiAssignment == nil || g1.streamAssignment() != apiAssignment {
              t.Fatalf("BLOCKED: API did not adopt G1: live=%p old=%p assignment=%p err=%v", adopted,g1,apiAssignment,adoptErr)
          }
          t.Log("ATLAS_E3C2_G1_API_ADOPTION_VERIFIED=true")
          t.Log("ATLAS_E3CN_PUBLIC_API_REASSIGNED_ORPHAN_NAME=true")''')
          patch('t.Log("ATLAS_E3CN_G2_PUBLIC_API_CREATED_ACKED_SAME_PATH=true")', '''g2Msg, g2Err := g2.getMsg(1)
          if g2Err != nil || g2Msg == nil || string(g2Msg.Data) != "ATLAS_E3CN_G2_UNIQUE_ACKED_PAYLOAD" {
              t.Fatalf("BLOCKED: G2 distinct payload missing: %v", g2Err)
          }
          time.Sleep(500*time.Millisecond)
          still, stillErr := acc.lookupStream(name)
          _, stillPathErr := os.Stat(fs2.fcfg.StoreDir)
          if stillErr != nil || still != g2 || stillPathErr != nil || g2.closed.Load() {
              t.Fatalf("BLOCKED: G2 unstable before release: %v %v", stillErr,stillPathErr)
          }
          t.Log("ATLAS_E3C2_G2_PAUSED_CONTROL_VERIFIED=true")
          t.Log("ATLAS_E3CN_G2_PUBLIC_API_CREATED_ACKED_SAME_PATH=true")''')
          path=Path('nats/server/atlas_e3c_native_orphan_test.go')
          path.write_text(old)
          print('ATLAS_E3C2_PRE_GO_FMT_SHA256='+hashlib.sha256(old.encode()).hexdigest())
          print('ATLAS_E3C2_SCOPE=UNSUPPORTED_MIGRATION_NOT_ISSUE_7556')
          PY
          gofmt -w nats/server/atlas_e3c_native_orphan_test.go
          test -z "$(gofmt -l nats/server/atlas_e3c_native_orphan_test.go)"
          test -z "$(git -C nats diff --name-only)"
          sha256sum nats/server/atlas_e3c_native_orphan_test.go > atlas-e3c2-test-sha256.txt
      - name: Run only natural migration; print full error and identity evidence
        shell: bash
        run: |
          set +e
          set -o pipefail
          (cd nats && go test ./server -run '^TestAtlasE3CNaturalOrphanMigration$' -count=1 -timeout=8m -v) 2>&1 | tee atlas-e3c2-run.log
          rc=$?
          echo "ATLAS_E3C2_GO_EXIT=$rc"
          echo "$rc" > atlas-e3c2-run.exit
          exit 0
      - name: Preserve evidence even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-e3c2-native-3node-evidence
          path: |
            atlas-e3c2-*
            nats/server/atlas_e3c_native_orphan_test.go
          if-no-files-found: warn
      - name: Strict final verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f atlas-e3c2-run.exit
          test "$(cat atlas-e3c2-run.exit)" = 0
          grep -Fq 'ATLAS_E3C2_G1_PAYLOAD_VERIFIED=true' atlas-e3c2-run.log
          grep -Fq 'ATLAS_E3C2_G1_API_ADOPTION_VERIFIED=true' atlas-e3c2-run.log
          grep -Fq 'ATLAS_E3C2_G2_PAUSED_CONTROL_VERIFIED=true' atlas-e3c2-run.log
          grep -Fq 'ATLAS_E3CN_VERDICT=REAL_TIMER_NATURAL_ORPHAN_PUBLIC_API_LIFECYCLE' atlas-e3c2-run.log
          echo 'ATLAS_E3C2_VERDICT=PASS_UNSUPPORTED_MIGRATION_ONLY'
