# ATLAS E2E-B2: corrected on-disk JetStream root for five independent NATS processes, live minority snapshot corruption,
# SIGKILL on exactly two processes, same-store restart, and post-fault verification.
# Original upstream commit frozen; no product source patching or legitimate Delete.
# Diagnostic only. No assertion that nats-io/nats-server #7556 is reproduced or fixed.
# Embedded Python driver SHA-256: ae9f0819421d31feeb9c9aa3619427a7af869ba7d08763026e82ba20cbdd6ef6
# Embedded Go client SHA-256: 7e12fca62893a0709c4c701dcfc586981278db5bec478e19f317a626c394a49a
name: ATLAS NATS E2E B2 External Process Crash Control

on:
  workflow_dispatch:

permissions:
  contents: read

