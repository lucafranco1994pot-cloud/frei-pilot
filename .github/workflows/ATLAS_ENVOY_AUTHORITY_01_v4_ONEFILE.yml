      - name: Verify checker and embedded package
        shell: bash
        run: |
          set -euo pipefail
          cd atlas_envoy_authority_01_v4
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          obj=json.loads(pathlib.Path('manifest.json').read_text())
          for filename, sha in obj['files_sha256'].items():
              actual=hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()
              assert actual==sha,(filename,actual,sha)
          print('Embedded file checksums: PASS')
          PYCODE
          python3 -m unittest -q test_checker.py
          python3 -m py_compile run_native.py mock.py verify.py test_checker.py
      - name: Download official standalone Envoy v1.40.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            -o /tmp/atlas-envoy-v1.40.2 \
            https://github.com/envoyproxy/envoy/releases/download/v1.40.2/envoy-1.40.2-linux-x86_64
          chmod 700 /tmp/atlas-envoy-v1.40.2
          file /tmp/atlas-envoy-v1.40.2
          sha256sum /tmp/atlas-envoy-v1.40.2
          /tmp/atlas-envoy-v1.40.2 --version
      - name: Install pinned local gRPC stub dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check grpcio==1.67.1
      - name: Execute exact one native A/B/creation-failure test
        shell: bash
        run: |
          set -uo pipefail
          cd atlas_envoy_authority_01_v4
          python3 run_native.py --envoy-bin /tmp/atlas-envoy-v1.40.2 > native_console.log 2>&1
          result=$?
          cat native_console.log
          if [[ "$result" -eq 0 ]]; then
            echo '## NATIVE_ROUTE_AUTHORITY_FALLBACK_OBSERVED' >> "$GITHUB_STEP_SUMMARY"
            echo 'Native fallback confirmed under controls. Security impact is NOT automatically proven.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [[ "$result" -eq 1 ]]; then
            echo '## NATIVE_BYPASS_NOT_OBSERVED' >> "$GITHUB_STEP_SUMMARY"
            echo 'Native B denial confirmed; fallback not observed under tested conditions.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo '## BLOCKED / INCONCLUSIVE' >> "$GITHUB_STEP_SUMMARY"
            echo 'See evidence artifact for exact reason. No security conclusion.' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
      - name: Preserve native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-envoy-authority-01-native-${{ github.run_id }}
          path: |
            atlas_envoy_authority_01_v4/runs/**
            atlas_envoy_authority_01_v4/native_console.log
            atlas_envoy_authority_01_v4/README.md
            atlas_envoy_authority_01_v4/manifest.json
          retention-days: 14
          if-no-files-found: warn
