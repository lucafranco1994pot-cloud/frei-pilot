name: ATLAS FS010 R2 V6 Cleanup Ownership Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build isolated probe from frozen R2 V2 source
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, re, difflib
          original_yaml = pathlib.Path('.github/workflows/ATLAS_FS010_R2_V2_PROVIDER_FIX.yml').read_text()
          embedded = re.search(r"gzip\.decompress\(base64\.b64decode\('([^']+)'\)\)", original_yaml)
          assert embedded, 'Frozen baseline not found'
          original = gzip.decompress(base64.b64decode(embedded.group(1)))
          sha = hashlib.sha256(original).hexdigest()
          assert sha == '0b2fdd80e27266a0255defce8fdf6f16552c5007e652f9af1fed86030cf60472', 'Baseline changed'
          before = original.decode()
          lines = before.splitlines(keepends=True)
          sites = [i for i, line in enumerate(lines) if line.strip() == 'await cleanup.aclose()']
          assert len(sites) == 2, f'Unexpected cleanup sites: {len(sites)}'
          i = sites[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = (
              indent + 'for attempt in (1, 2):\n'
              + indent + '    try:\n'
              + indent + '        await asyncio.wait_for(cleanup.aclose(), timeout=5)\n'
              + indent + '        print("ATLAS_CLEANUP", attempt, "RETURNED", flush=True)\n'
              + indent + '    except RuntimeError as error:\n'
              + indent + '        print("ATLAS_CLEANUP", attempt, "ERROR", repr(error), flush=True)\n'
              + indent + '        assert "Canonical storage failed" in str(error)\n'
          )
          after = ''.join(lines)
          pathlib.Path('test_fs010_r2_v6.py').write_text(after)
          pathlib.Path('evidence/PATCH.diff').write_text(''.join(difflib.unified_diff(before.splitlines(True), after.splitlines(True), fromfile='R2-V2', tofile='R2-V6')))
          pathlib.Path('evidence/BASELINE_SHA256.txt').write_text(sha + ' original\n' + hashlib.sha256(after.encode()).hexdigest() + ' probe\n')
          PY
          python -m py_compile test_fs010_r2_v6.py
      - name: Install pinned SDK with release checksum check
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing | tee evidence/WHEEL_VERIFY.txt
          python -m pip install -q pytest ./openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
      - name: Run R2-03 and classify cleanup without false PASS
        env:
          NO_PROXY: 127.0.0.1,localhost
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        run: |
          set -euo pipefail
          python -m pytest -vv -s test_fs010_r2_v6.py -k r2_03 > evidence/TEST_LOG.txt 2>&1 || echo $? > evidence/TEST_EXIT.txt
          cat evidence/TEST_LOG.txt
          python - <<'PY'
          import json, pathlib, re
          log = pathlib.Path('evidence/TEST_LOG.txt').read_text()
          exitfile = pathlib.Path('evidence/TEST_EXIT.txt')
          code = int(exitfile.read_text()) if exitfile.exists() else 0
          attempts = re.findall(r'ATLAS_CLEANUP (\d+) (RETURNED|ERROR)([^\n]*)', log)
          blocked = 'NativeProvider has open or opening Sessions' in log
          verdict = 'PASS_R2_03' if code == 0 else ('BLOCKED_CLEANUP' if blocked else 'FAIL_OTHER')
          report = {'verdict': verdict, 'pytest_exit_code': code, 'cleanup_attempts': attempts, 'provider_still_open': blocked, 'sdk_test_passed': code == 0}
          pathlib.Path('evidence/VERDICT.json').write_text(json.dumps(report, indent=2))
          print('ATLAS_VERDICT', json.dumps(report))
          # This job is a diagnostic: an unresolved failure is never labeled a PASS.
          PY
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p evidence
          python --version > evidence/PYTHON.txt
          echo 'OpenAI Agents SDK 0.24.0-alpha.7' > evidence/TARGET.txt
          (cd evidence && sha256sum *.txt *.json *.diff > SHA256SUMS.txt) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-FS010-R2-V6-cleanup-probe
          path: evidence/
          retention-days: 90
