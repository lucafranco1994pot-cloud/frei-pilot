# ATLAS NATS E1: unchanged upstream regression test at pinned NATS baseline.
# Verifies that the corrupted-snapshot error path is actually COVERED.
# Does not assert JetStream metadata/data deletion; E0 is a separate case.
name: ATLAS NATS E1 Send Error Reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-send-error-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: auto
      EVIDENCE_DIR: ${{ github.workspace }}/atlas_e1_evidence
    steps:
      - name: Checkout frozen NATS sources (no modifications)
        uses: actions/checkout@v4
        with:
          repository: nats-io/nats-server
          ref: d163ae747ad050ea89054f8fb03c43e64e737aea
          fetch-depth: 1
          path: nats

      - name: Install upstream Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git -C nats rev-parse HEAD | tee "$EVIDENCE_DIR/product_commit.txt"
          test "$(cat "$EVIDENCE_DIR/product_commit.txt")" = d163ae747ad050ea89054f8fb03c43e64e737aea
          test "$(git -C nats hash-object server/raft_test.go)" = b1f2a83a77258c097faf8fedda3cda0943d76734
          test "$(git -C nats hash-object server/raft.go)" = 3c76b99e9bb0ac863c02e088da2766a1970813e0
          test "$(git -C nats hash-object go.mod)" = 5c0538ad934c66f5de5820d1a9111f503b149837
          test -z "$(git -C nats status --porcelain)"
          echo "ATLAS_E1_INPUTS=FROZEN_UPSTREAM_UNMODIFIED" | tee "$EVIDENCE_DIR/inputs.txt"

      - name: Run original upstream regression test once with branch coverage
        shell: bash
        run: |
          set -euo pipefail
          cd nats
          go test ./server -run '^TestNRGNoLogResetOnCorruptedSendToFollower$' -count=1 -timeout=8m -v -covermode=atomic -coverprofile="$EVIDENCE_DIR/coverage.out" 2>&1 | tee "$EVIDENCE_DIR/upstream_test.log"

      - name: Prove error branch executed and WAL reset absent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$EVIDENCE_DIR/audit.log"
          from pathlib import Path
          import re, sys

          source = Path("nats/server/raft.go").read_text()
          marker = "func (n *raft) sendSnapshotToFollower("
          if source.count(marker) != 1:
              sys.exit("ATLAS_E1_VERDICT=BLOCKED_FUNCTION_IDENTITY")
          start = source.index(marker)
          end = source.find("\nfunc ", start + len(marker))
          fn = source[start:end if end != -1 else None]
          branch = ("if err != nil {\n"
                    "\t\t// We need to stepdown here when this happens.\n"
                    "\t\tn.stepdownLocked(noLeader)\n"
                    "\t\treturn 0, err\n"
                    "\t}")
          if branch not in fn:
              sys.exit("ATLAS_E1_VERDICT=BLOCKED_ERROR_BRANCH_SOURCE")
          target = source[:start].count("\n") + fn[:fn.index("n.stepdownLocked(noLeader)" )].count("\n") + 1
          pat = re.compile(r"^(.+):(\d+)\.(\d+),(\d+)\.(\d+)\s+(\d+)\s+(\d+)$")
          matching = []
          for line in Path("atlas_e1_evidence/coverage.out").read_text().splitlines()[1:]:
              m = pat.match(line)
              if not m or not m.group(1).endswith("/server/raft.go"):
                  continue
              first, last, stmts, hits = int(m.group(2)), int(m.group(4)), int(m.group(6)), int(m.group(7))
              if first <= target <= last and stmts > 0:
                  matching.append((first, last, stmts, hits))
          if not matching or max(row[3] for row in matching) == 0:
              sys.exit(f"ATLAS_E1_VERDICT=BLOCKED_ERROR_BRANCH_NOT_COVERED target_line={target} intervals={matching}")
          log = Path("atlas_e1_evidence/upstream_test.log").read_text()
          if not re.search(r"--- PASS: TestNRGNoLogResetOnCorruptedSendToFollower", log):
              sys.exit("ATLAS_E1_VERDICT=BLOCKED_UPSTREAM_TEST_NOT_PASSED")
          print(f"ATLAS_E1_ERROR_BRANCH_LINE={target} intervals={matching}")
          print("ATLAS_E1_VERDICT=UPSTREAM_TEST_PASS_ERROR_BRANCH_COVERED_NO_RESET_WAL")
          print("ATLAS_E1_SCOPE=SEPARATE_TEST_RAFT_GROUP_NOT_META_SNAPSHOT_DELETE")
          PY
          test -z "$(git -C nats status --porcelain)"

      - name: Hash and preserve original evidence even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          (cd "$EVIDENCE_DIR"; find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS.txt)
          cat "$EVIDENCE_DIR/SHA256SUMS.txt"

      - name: Upload E1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e1-original-reference
          path: atlas_e1_evidence/
          if-no-files-found: warn
