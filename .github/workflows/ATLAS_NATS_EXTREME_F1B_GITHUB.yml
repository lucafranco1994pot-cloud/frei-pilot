      - name: Freeze and audit inputs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== FROZEN BASELINE ==='
            git -C nats rev-parse HEAD
            echo '=== GO VERSION ==='
            go version
            echo '=== SOURCE DIFF ==='
            git -C nats status --porcelain
            echo '=== TEST SHA256 ==='
            sha256sum nats/server/atlas_extreme_01_test.go
          } | tee atlas-f1-inputs.log
          test "$(git -C nats rev-parse HEAD)" = 'd163ae747ad050ea89054f8fb03c43e64e737aea'

      - name: Execute F1B once (control and two corrupt snapshots)
        id: run_probe
        working-directory: nats
        shell: bash
        run: |
          set +e
          set -o pipefail
          go test ./server -run '^TestAtlasExtreme01MinorityMetaSnapshots$' -count=1 -timeout=15m -v 2>&1 | tee ../atlas-f1-test.log
          rc=${PIPESTATUS[0]}
          echo "GO_TEST_EXIT=$rc" | tee -a ../atlas-f1-test.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Audit outputs and create result summary
        if: always()
        shell: bash
        run: |
          set -u
          {
            echo '=== F1 EXIT CODE ==='
            echo "${{ steps.run_probe.outputs.exit_code }}"
            echo '=== TEST LOG SHA256 ==='
            if [ -e atlas-f1-test.log ]; then sha256sum atlas-f1-test.log; else echo 'BLOCKED: no test log'; fi
            echo '=== PRODUCT CHANGES ==='
            git -C nats status --porcelain || true
            echo '=== IMPORTANT TEST LINES ==='
            if [ -e atlas-f1-test.log ]; then
              grep -E 'ATLAS_RESULT|ATLAS_VERDICT|ATLAS_RESTART|ATLAS stage=|ATLAS fault|ATLAS_API|--- (PASS|FAIL|SKIP)|^FAIL|GO_TEST_EXIT|BLOCKED|RED CANDIDATE' atlas-f1-test.log | tail -n 140 || true
            fi
          } | tee atlas-f1-summary.txt
          {
            echo '# ATLAS-EXTREME-01 / F1B'
            echo ''
            echo 'Frozen NATS commit: `d163ae747ad050ea89054f8fb03c43e64e737aea`'
            echo ''
            echo 'A green GitHub job is NOT proof of full recovery; an inconclusive corrupt-target subtest is explicitly SKIPPED.'
            echo 'The result is **not automatically a proven NATS bug**. Compile failures mean BLOCKED, unavailability is not data loss, and control-versus-corruption must be evaluated separately.'
            echo ''
            echo 'Open the workflow artifact for complete logs, hashes and test evidence.'
            echo '```'
            cat atlas-f1-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-f1b-evidence
          path: |
            atlas-f1-inputs.log
