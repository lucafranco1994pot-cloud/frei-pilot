      - name: Apply explicit temporary log probes only
        shell: bash
        run: |
          set -euo pipefail
          python3 atlas-e2c-instrument.py | tee atlas-e2c-patch-info.txt
          git -C nats diff -- server/jetstream_cluster.go > atlas-e2c-diagnostic-source.diff
          test -s atlas-e2c-diagnostic-source.diff
          test "$(git -C nats diff --name-only)" = 'server/jetstream_cluster.go'
          test -z "$(gofmt -l nats/server/jetstream_cluster.go)"
          cp nats/server/jetstream_cluster.go atlas-e2c-instrumented-jetstream_cluster.go
          sha256sum atlas-e2c-diagnostic-source.diff atlas-e2c-instrumented-jetstream_cluster.go | tee -a atlas-e2c-patch-info.txt
      - name: Mandatory exact test selection before run
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd nats && go test ./server -list '^TestAtlasE2CHealthyMetaSnapshotCatchup$') > atlas-e2c-test-list.txt 2> atlas-e2c-list-stderr.txt
          rc=$?
          set -e
          echo "ATLAS_E2C_LIST_EXIT=$rc" | tee atlas-e2c-selection.txt
          if [ "$rc" -ne 0 ]; then echo 'ATLAS_E2C_SELECTION=BLOCKED_LIST_ERROR'; exit 4; fi
          matches=$(grep -Fxc "$E2C_TEST" atlas-e2c-test-list.txt || true)
          echo "ATLAS_E2C_MATCHES=$matches" | tee -a atlas-e2c-selection.txt
          if [ "$matches" != 1 ]; then echo 'ATLAS_E2C_SELECTION=BLOCKED_ZERO_OR_MULTIPLE'; exit 4; fi
          echo 'ATLAS_E2C_SELECTION=EXACT_ONE' | tee -a atlas-e2c-selection.txt
      - name: Run exactly one selected test with cold cache
        id: test
        shell: bash
        working-directory: nats
        env:
          ATLAS_E2C_EVIDENCE_DIR: ${{ github.workspace }}/atlas-e2c-raw
        run: |
          set +e
          go test ./server -run '^TestAtlasE2CHealthyMetaSnapshotCatchup$' -count=1 -timeout=20m -covermode=atomic -coverprofile=../atlas-e2c-coverage.out -v > ../atlas-e2c-test.log 2> ../atlas-e2c-stderr.txt
          rc=$?
          echo "$rc" > ../atlas-e2c-go-test.exit
          echo "ATLAS_E2C_GO_TEST_EXIT=$rc"
          exit "$rc"
      - name: Separately audit execution decision and snapshot identity
        if: always()
        shell: bash
        run: |
          python3 - <<'ATLAS_E2C_AUDIT' | tee atlas-e2c-audit.txt
          from pathlib import Path
          import re,hashlib
          n='TestAtlasE2CHealthyMetaSnapshotCatchup'
          log=Path('atlas-e2c-test.log').read_text(errors='replace') if Path('atlas-e2c-test.log').exists() else ''
          try: rc=int(Path('atlas-e2c-go-test.exit').read_text().strip())
          except (ValueError,OSError): rc=-999
          listfile=Path('atlas-e2c-test-list.txt')
          selected=listfile.exists() and listfile.read_text().splitlines().count(n)==1
          run=len(re.findall(r'^=== RUN\s+'+re.escape(n)+r'\s*$',log,re.M))
          passed=len(re.findall(r'^--- PASS: '+re.escape(n)+r'\s+\(',log,re.M))
          failed=len(re.findall(r'^--- FAIL: '+re.escape(n)+r'\s+\(',log,re.M))
          skipped=len(re.findall(r'^--- SKIP: '+re.escape(n)+r'\s+\(',log,re.M))
          check={
            'selection_exactly_one':selected,
            'exact_one_run_and_pass':run==1 and passed==1 and failed==0 and skipped==0 and rc==0,
            'authorized_delete':bool(re.search(r'ATLAS_E2C_AUTHORIZED_DELETE stream=DOOMED .*err=nil',log)),
            'snapshot_transfer':bool(re.search(r'ATLAS_E2C_TRANSFER_PROOF .*receiver_index_verified=true payload_identical=true',log)),
            'target_local_meta':bool(re.search(r'ATLAS_E2C_LOCAL_META_ASSIGNMENT .*stream=ATLAS .*consistent=true',log)),
            'application_bound':bool(re.search(r'ATLAS_E2C_SNAPSHOT_APPLICATION .*bound=true',log)),
            'correct_selection_and_deletion':bool(re.search(r'ATLAS_E2C_DECISION_AUDIT .*control_validly_deleted=true ATLAS_protected=true snapshot_bound=true',log)),
            'explicit_test_verdict':bool(re.search(r'ATLAS_E2C_VERDICT=LEGITIMATE_DELETION_TRACED_ATLAS_PRESERVED',log)),
            'trace_manifest':Path('atlas-e2c-raw/target-decision-trace.tsv').is_file(),
          }
          print('ATLAS_E2C_TEST='+n)
          print('ATLAS_E2C_GO_TEST_EXIT='+str(rc))
          print('ATLAS_E2C_TEST_EVENTS run=%d pass=%d fail=%d skip=%d'%(run,passed,failed,skipped))
          print('ATLAS_E2C_SCOPE=instrumented_logging_control_not_upstream_pristine')
          print('ATLAS_E2C_LIMIT=no_corruption_or_issue_7556_reproduction')
          print('ATLAS_E2C_LIMIT=other_uninstrumented_delete_paths_not_excluded')
          for k,v in check.items(): print('ATLAS_E2C_CHECK=%s passed=%s'%(k,str(v).lower()))
          print('ATLAS_E2C_AUDIT_VERDICT='+('DIAGNOSTIC_CONTROL_PASS' if all(check.values()) else 'NOT_PROVEN_OR_FAIL'))
          ATLAS_E2C_AUDIT
          {
            echo '=== E2C audit ==='; cat atlas-e2c-audit.txt
            echo '=== original test outcome ==='
            grep -E '^=== RUN|^--- (PASS|FAIL|SKIP):|ATLAS_E2C_(VERDICT|SNAPSHOT_APPLICATION|DECISION_AUDIT|TRANSFER_PROOF|CONTROL_AFTER)' atlas-e2c-test.log 2>/dev/null || true
            echo '=== source hashes ==='; cat atlas-e2c-patch-info.txt 2>/dev/null || true
          } | tee atlas-e2c-summary.txt
          cat atlas-e2c-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Create self-excluding evidence hash manifest and verify it
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ATLAS_E2C_HASH'
          from pathlib import Path
          import hashlib
          root=Path('.')
          manifest=root/'atlas-e2c-evidence-sha256.txt'
          required={
            'atlas-e2c-inputs.txt', 'atlas-e2c-selection.txt', 'atlas-e2c-test-list.txt',
            'atlas-e2c-test.log', 'atlas-e2c-go-test.exit', 'atlas-e2c-audit.txt',
            'atlas-e2c-summary.txt', 'atlas-e2c-patch-info.txt', 'atlas-e2c-instrument.py',
            'atlas-e2c-original-jetstream_cluster.go',
            'atlas-e2c-instrumented-jetstream_cluster.go',
            'atlas-e2c-diagnostic-source.diff',
            'nats/server/atlas_e2c_decision_trace_test.go',
            'atlas-e2c-raw/ack-manifest.tsv',
            'atlas-e2c-raw/assignment-manifest.tsv',
            'atlas-e2c-raw/target-decision-trace.tsv',
            'atlas-e2c-raw/leader-meta-snapshot.bin',
            'atlas-e2c-raw/follower-meta-snapshot.bin',
          }
          paths={p for p in root.glob('atlas-e2c-*') if p.is_file() and p!=manifest}
          paths|={p for p in root.glob('atlas-e2c-raw/**/*') if p.is_file()}
          source=root/'nats/server/atlas_e2c_decision_trace_test.go'
          if source.is_file():paths.add(source)
          missing=sorted(s for s in required if not (root/s).is_file())
          report=root/'atlas-e2c-manifest-audit.txt'
          report.write_text('ATLAS_E2C_HASH_REQUIRED_MISSING='+(','.join(missing) if missing else 'NONE')+'\n'+
            'ATLAS_E2C_MANIFEST_SELF_INCLUDED=false\n')
          paths.add(report)
          paths.discard(manifest)
          lines=[]
          for p in sorted(paths,key=lambda q:q.as_posix()):
            lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.as_posix())
          manifest.write_text('\n'.join(lines)+'\n')
          print('ATLAS_E2C_MANIFEST_ENTRIES='+str(len(lines)))
          print(report.read_text())
          if missing:raise SystemExit(4)
          ATLAS_E2C_HASH
          sha256sum --check atlas-e2c-evidence-sha256.txt
          if grep -Fq 'atlas-e2c-evidence-sha256.txt' atlas-e2c-evidence-sha256.txt; then
             echo 'ATLAS_E2C_BLOCKED=self_hash_in_manifest'; exit 5
          fi
      - name: Upload exact audit and materials even if test or gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e2c-v2-fixed-control-evidence
          path: |
            atlas-e2c-inputs.txt
            atlas-e2c-selection.txt
            atlas-e2c-test-list.txt
            atlas-e2c-list-stderr.txt
            atlas-e2c-patch-info.txt
            atlas-e2c-instrument.py
            atlas-e2c-original-jetstream_cluster.go
            atlas-e2c-instrumented-jetstream_cluster.go
            atlas-e2c-diagnostic-source.diff
            atlas-e2c-test.log
            atlas-e2c-stderr.txt
            atlas-e2c-go-test.exit
            atlas-e2c-coverage.out
            atlas-e2c-audit.txt
            atlas-e2c-summary.txt
            atlas-e2c-evidence-sha256.txt
            atlas-e2c-manifest-audit.txt
            atlas-e2c-manifest-check.txt
            atlas-e2c-raw/**
            nats/server/atlas_e2c_decision_trace_test.go
          if-no-files-found: warn
          retention-days: 14
      - name: Mandatory final PASS gate after evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f atlas-e2c-audit.txt
          grep -Fxq 'ATLAS_E2C_AUDIT_VERDICT=DIAGNOSTIC_CONTROL_PASS' atlas-e2c-audit.txt
          test -f atlas-e2c-manifest-check.txt
          test -f atlas-e2c-evidence-sha256.txt
          sha256sum --check atlas-e2c-evidence-sha256.txt >/dev/null
          echo 'ATLAS_E2C_FINAL_GATE=PASS'
