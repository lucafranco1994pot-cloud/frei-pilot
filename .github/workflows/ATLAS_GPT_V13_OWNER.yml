name: ATLAS GPT V13 approval owner serialization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact OpenAI Agents SDK
        run: |
          python -m pip install 'git+https://github.com/openai/openai-agents-python.git@e355d69152d4f4730dfb03b63dbce53e8d9f5d8c'
          python -m pip show openai-agents > sdk_version.txt

      - name: Check approval binding with serialized state
        shell: bash
        run: |
          cat > atlas_v13_probe.py <<'ATLAS_SCRIPT_V13'
          import asyncio
          import hashlib
          import json
          import traceback
          from pathlib import Path
          from agents import Agent, Runner, RunState, RunConfig
          from agents.decorators import tool
          from agents.testing import ScriptedModel, assistant_message, function_call
          
          COMMIT = 'e355d69152d4f4730dfb03b63dbce53e8d9f5d8c'
          CONFIG = RunConfig(tracing_disabled=True)
          CASES = (
              'valid_current_serialized',
              'rejected_current_serialized',
              'old_item_other_agent',
              'old_item_other_agent_serialized',
              'old_item_same_agent_serialized',
              'old_item_other_tool_same_agent',
          )
          
          async def examine(case):
              effects = []
          
              @tool(needs_approval=True)
              async def mark_a(target: str) -> str:
                  """Write a harmless in-memory marker for the approved A tool."""
                  effects.append('A:' + target)
                  return 'MARKED_A:' + target
          
              @tool(needs_approval=True)
              async def mark_b(target: str) -> str:
                  """Write a harmless in-memory marker for the other B tool."""
                  effects.append('B:' + target)
                  return 'MARKED_B:' + target
          
              def model(tool_name='mark_a'):
                  return ScriptedModel([
                      [function_call(tool_name, {'target':'vault'}, call_id='call-same')],
                      [assistant_message('Finished')],
                  ])
          
              old = Agent(name='identical name', tools=[mark_a, mark_b], model=model())
              first = await Runner.run(old,'old independent run',run_config=CONFIG)
              assert len(first.interruptions)==1 and not effects
              old_item = first.interruptions[0]
              state_first = first.to_state()
              state_first.approve(old_item)
              completed_old = await Runner.run(old,state_first,run_config=CONFIG)
              assert not completed_old.interruptions and effects==['A:vault']
          
              other_agent = case in {'old_item_other_agent','old_item_other_agent_serialized'}
              other_tool = case=='old_item_other_tool_same_agent'
              new_agent = (Agent(name='identical name',tools=[mark_a,mark_b],
                                 model=model('mark_b' if other_tool else 'mark_a'))
                           if other_agent else old)
              if new_agent is old:
                  old.model=model('mark_b' if other_tool else 'mark_a')
              latest = await Runner.run(new_agent,'new independent run',run_config=CONFIG)
              assert len(latest.interruptions)==1 and effects==['A:vault']
              pending = latest.interruptions[0]
              state = latest.to_state()
          
              serialized = case.endswith('_serialized')
              if serialized:
                  state = await RunState.from_json(new_agent,state.to_json())
                  assert len(state.get_interruptions())==1
          
              if case == 'valid_current_serialized':
                  candidate=state.get_interruptions()[0]
                  state.approve(candidate)
              elif case == 'rejected_current_serialized':
                  candidate=state.get_interruptions()[0]
                  state.reject(candidate)
              else:
                  candidate=old_item
                  state.approve(candidate)
          
              resumed = await Runner.run(new_agent,state,run_config=CONFIG)
              new_effects=effects[1:]
              return {
                  'case':case,
                  'old_effects':effects[:1],
                  'new_effects':new_effects,
                  'pending_count':len(resumed.interruptions),
                  'same_agent_object':new_agent is old,
                  'same_tool_implementation':not other_tool,
                  'serialized_before_decision':serialized,
              }
          
          async def main():
              rows=[]
              for case in CASES:
                  try:
                      row=await examine(case)
                      effects=row['new_effects']
                      if case=='valid_current_serialized':
                          row['verdict']='PASS' if effects==['A:vault'] and row['pending_count']==0 else 'FAIL'
                      elif case=='rejected_current_serialized':
                          row['verdict']='PASS' if not effects else 'FAIL'
                      elif case=='old_item_same_agent_serialized':
                          row['verdict']='KNOWN_5413_VARIANT' if effects==['A:vault'] else 'NO_TRANSFER_OBSERVED'
                      else:
                          row['verdict']='PASS' if not effects else 'FAIL'
                  except Exception as err:
                      row={'case':case,'verdict':'BLOCKED','error':f'{type(err).__name__}: {err}',
                           'traceback':traceback.format_exc()}
                  rows.append(row)
                  print(json.dumps({k:v for k,v in row.items() if k!='traceback'},sort_keys=True))
              totals={v:sum(x['verdict']==v for x in rows) for v in
                      ['PASS','FAIL','BLOCKED','KNOWN_5413_VARIANT','NO_TRANSFER_OBSERVED']}
              result={'kind':'ATLAS-GPT-V13-APPROVAL-OWNER-SERIALIZATION',
                      'sdk_git_commit':COMMIT,
                      'scope':'public SDK API / isolated scripted model / no API keys / no external effects',
                      'totals':totals, 'cases':rows,
                      'not_a_new_vulnerability_claim':True}
              result['script_sha256']=hashlib.sha256(Path(__file__).read_bytes()).hexdigest()
              Path('atlas_v13_results.json').write_text(json.dumps(result,indent=2)+'\n')
              return 1 if totals['FAIL'] or totals['BLOCKED'] else 0
          
          raise SystemExit(asyncio.run(main()))
          ATLAS_SCRIPT_V13
          python -m py_compile atlas_v13_probe.py
          python atlas_v13_probe.py

      - name: Record evidence integrity
        if: always()
        run: |
          python -m pip freeze > dependencies.txt
          (sha256sum atlas_v13_probe.py atlas_v13_results.json sdk_version.txt dependencies.txt 2>/dev/null || true) > SHA256SUMS

      - name: Archive evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-gpt-v13-approval-owner-evidence
          path: |
            atlas_v13_probe.py
            atlas_v13_results.json
            sdk_version.txt
            dependencies.txt
            SHA256SUMS
          if-no-files-found: warn
