        run: |
          set +e
          go test ./server -run '^TestAtlasE2DOnlineMinoritySnapshotLeaderTransfer$' -count=1 -timeout=17m -v > ../atlas-e2d-test.log 2> ../atlas-e2d-stderr.txt
