          set -e
          echo "ATLAS_E2D_LIST_EXIT=$rc" | tee atlas-e2d-selection.txt
          if [ "$rc" -ne 0 ]; then echo 'ATLAS_E2D_SELECTION=BLOCKED_LIST_ERROR'; exit 5; fi
          matches=$(grep -Fxc "$E2D_TEST" atlas-e2d-test-list.txt || true)
          echo "ATLAS_E2D_MATCHES=$matches" | tee -a atlas-e2d-selection.txt
