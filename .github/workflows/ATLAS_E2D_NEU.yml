# ATLAS E2D: online minority META snapshot bitflips, targeted leadership transfer.
# A distinct test of fault timing; NOT a reproduction or fix of NATS #7556.
# No NATS product source modifications; additive test only.
# Frozen NATS commit: d163ae747ad050ea89054f8fb03c43e64e737aea
# Additive Go test SHA-256: 8ec2d7bf96e29c90cc0800dac59290eb5b2b46ee8250a31e358ebcb224fb3b5c
name: ATLAS NATS E2D Live Corrupt Snapshot Leader Handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2d-online-corruption:
