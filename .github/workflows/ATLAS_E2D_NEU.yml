        shell: bash
        run: |
          python3 - <<'ATLAS_E2D_AUDIT' | tee atlas-e2d-audit.txt
          from pathlib import Path
          import re,hashlib
          name='TestAtlasE2DOnlineMinoritySnapshotLeaderTransfer'
          log=Path('atlas-e2d-test.log').read_text(errors='replace') if Path('atlas-e2d-test.log').exists() else ''
          try: rc=int(Path('atlas-e2d-go-test.exit').read_text().strip())
          except (OSError,ValueError): rc=-999
          try: selection=Path('atlas-e2d-test-list.txt').read_text().splitlines().count(name)==1
          except OSError: selection=False
          run=len(re.findall(r'^=== RUN\s+'+re.escape(name)+r'\s*$',log,re.M))
          passed=len(re.findall(r'^--- PASS: '+re.escape(name)+r'\s+\(',log,re.M))
          failed=len(re.findall(r'^--- FAIL: '+re.escape(name)+r'\s+\(',log,re.M))
          skipped=len(re.findall(r'^--- SKIP: '+re.escape(name)+r'\s+\(',log,re.M))
          flips=re.findall(r'ATLAS_E2D_BITFLIP node=([^\s]+) .*?exactly_one_bit=true',log)
          after=re.findall(r'ATLAS_E2D_AFTER node=([^\s]+) identity_equal=(true|false) local_verified=(\d+) local_error=([^\n]+)',log)
          original=Path('nats/server/atlas_e2d_live_corrupt_leader_test.go')
          test_sha='8ec2d7bf96e29c90cc0800dac59290eb5b2b46ee8250a31e358ebcb224fb3b5c'
          check={
            'selection_exactly_one':selection,
            'exact_one_run_pass_no_skip':run==1 and passed==1 and failed==0 and skipped==0 and rc==0,
            'two_real_single_bit_injections':len(flips)==2 and len(set(flips))==2,
            'real_corrupt_target_election':bool(re.search(r'ATLAS_E2D_ELECTION corrupted_target=\S+ elected_meta_leader=true disk_snapshot_still_corrupt=true',log)),
            'five_local_replica_bytes':len(after)==5 and len(set(a[0] for a in after))==5 and all(a[1]=='true' and a[2]=='100' and a[3]=='<nil>' for a in after),
            'no_wrong_delete_observed':bool(re.search(r'ATLAS_E2D_OBSERVATION elected_corrupted_meta_leader=true original_ATLAS_identity_all5=true local_100_all5=true .*orphan_checks_on_elected_leader=[1-9][0-9]* detected_orphan_warnings=0 fatal_logs=0',log)),
            'explicit_result': 'ATLAS_E2D_VERDICT=ONLINE_CORRUPT_SNAPSHOT_LEADER_ELECTED_NO_WRONG_DELETE_OBSERVED' in log,
            'source_file_hash_correct':original.is_file() and hashlib.sha256(original.read_bytes()).hexdigest()==test_sha,
            'raw_ack_manifest':Path('atlas-e2d-raw/ack-manifest.tsv').is_file(),
            'two_before_after_snapshots':len(list(Path('atlas-e2d-raw').glob('snap-before-*.bin')))==2 and len(list(Path('atlas-e2d-raw').glob('snap-after-*.bin')))==2,
            'leader_log_evidence':Path('atlas-e2d-raw/meta-leader-and-cleanup-events.tsv').is_file(),
          }
          print('ATLAS_E2D_RUN=%d PASS=%d FAIL=%d SKIP=%d GO_EXIT=%d'%(run,passed,failed,skipped,rc))
          print('ATLAS_E2D_BITFLIP_NODES='+','.join(flips))
          print('ATLAS_E2D_SCOPE=online_corruption_no_restart_before_handoff_one_35s_window')
          print('ATLAS_E2D_LIMIT=cannot_prove_original_Jepsen_issue_7556_or_universal_safety')
          print('ATLAS_E2D_LIMIT=absence_of_warning_is_not_global_delete_path_coverage')
          for k,v in check.items():print('ATLAS_E2D_CHECK=%s passed=%s'%(k,str(v).lower()))
          print('ATLAS_E2D_AUDIT_VERDICT='+('LIVE_CORRUPTED_META_LEADER_CONTROL_PASS' if all(check.values()) else 'BLOCKED_OR_RED_CANDIDATE_REQUIRES_REVIEW'))
          ATLAS_E2D_AUDIT
          {
            echo '=== E2D audit ==='
            cat atlas-e2d-audit.txt
            echo '=== original test key events ==='
            grep -E 'ATLAS_E2D_(BITFLIP|HANDOFF|ELECTION|OBSERVATION|VERDICT|AFTER|CORRUPTION_PERSISTENCE)|^=== RUN|^--- (PASS|FAIL|SKIP):' atlas-e2d-test.log 2>/dev/null || true
          } | tee atlas-e2d-summary.txt
          cat atlas-e2d-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Create and check complete evidence file hash manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ATLAS_E2D_HASH'
          from pathlib import Path
          import hashlib
          root=Path('.')
          manifest=root/'atlas-e2d-evidence-sha256.txt'
          required=['atlas-e2d-inputs.txt','atlas-e2d-selection.txt','atlas-e2d-test-list.txt','atlas-e2d-test.log','atlas-e2d-go-test.exit','atlas-e2d-audit.txt','atlas-e2d-summary.txt','atlas-e2d-original-raft.go','atlas-e2d-original-jetstream_cluster.go','nats/server/atlas_e2d_live_corrupt_leader_test.go']
          missing=[p for p in required if not (root/p).is_file()]
          raw=list(Path('atlas-e2d-raw').glob('*')) if Path('atlas-e2d-raw').exists() else []
          files={x for x in root.glob('atlas-e2d-*') if x.is_file() and x!=manifest}
          files.update(x for x in raw if x.is_file())
          p=root/'nats/server/atlas_e2d_live_corrupt_leader_test.go'
          if p.is_file():files.add(p)
          manifest.write_text(''.join('%s  %s\n'%(hashlib.sha256(x.read_bytes()).hexdigest(),x.as_posix()) for x in sorted(files)),encoding='utf8')
          print('ATLAS_E2D_HASH_MISSING='+(','.join(missing) if missing else 'NONE'))
          print('ATLAS_E2D_MANIFEST_SELF_INCLUDED='+str(manifest in files).lower())
          print('ATLAS_E2D_HASH_FILES='+str(len(files)))
          if missing:raise SystemExit('BLOCKED required evidence missing')
          ATLAS_E2D_HASH
          sha256sum --check atlas-e2d-evidence-sha256.txt | tee atlas-e2d-manifest-check.txt
      - name: Preserve all original evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e2d-live-minority-meta-snapshot-evidence
          path: |
            atlas-e2d-inputs.txt
            atlas-e2d-selection.txt
            atlas-e2d-test-list.txt
            atlas-e2d-list-stderr.txt
            atlas-e2d-test.log
            atlas-e2d-stderr.txt
            atlas-e2d-go-test.exit
            atlas-e2d-audit.txt
            atlas-e2d-summary.txt
            atlas-e2d-original-raft.go
            atlas-e2d-original-jetstream_cluster.go
            atlas-e2d-evidence-sha256.txt
            atlas-e2d-manifest-check.txt
            atlas-e2d-raw/**
            nats/server/atlas_e2d_live_corrupt_leader_test.go
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed if experiment not reached, inconclusive or hash invalid
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'ATLAS_E2D_AUDIT_VERDICT=LIVE_CORRUPTED_META_LEADER_CONTROL_PASS' atlas-e2d-audit.txt
          test -s atlas-e2d-evidence-sha256.txt
          test -s atlas-e2d-manifest-check.txt
          sha256sum --check atlas-e2d-evidence-sha256.txt > /dev/null
          echo 'ATLAS_E2D_FINAL_GATE=PASS'
