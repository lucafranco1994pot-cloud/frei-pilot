name: ATLAS FS010 R2 V2 Recovery and Provider Lifetime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r2_v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify embedded source
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PYCODE'
          import gzip,base64,hashlib,pathlib
          data=gzip.decompress(base64.b64decode(''))
          expected='0b2fdd80e27266a0255defce8fdf6f16552c5007e652f9af1fed86030cf60472'
          assert hashlib.sha256(data).hexdigest()==expected
          pathlib.Path('test_fs010_r2_v2.py').write_bytes(data)
          pathlib.Path('evidence/TEST_SHA256.txt').write_text(expected+'  test_fs010_r2_v2.py\n')
          PYCODE
          python -m py_compile test_fs010_r2_v2.py
      - name: Install verified pinned SDK
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing | tee evidence/WHEEL_VERIFY.txt
          python -m pip install -q pytest ./openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
          python -c "from importlib.metadata import version;import agents._native;print(version('openai-agents'))" | tee evidence/SDK.txt
      - name: Execute strict R2 controls
        env:
          NO_PROXY: 127.0.0.1,localhost
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        run: |
          set -o pipefail
          python -m pytest -vv -s test_fs010_r2_v2.py 2>&1 | tee evidence/PYTEST.txt
      - name: Record provenance
        if: always()
        run: |
          mkdir -p evidence
          python --version > evidence/PYTHON.txt 2>&1 || true
          echo 'target=0.24.0-alpha.7 commit=c27b24cc6c4fa7e89ab54fa9f795ef4f2d4d5fb9' > evidence/TARGET.txt
          (cd evidence && sha256sum *.txt > SHA256SUMS.txt) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-FS010-R2-V2-evidence
          path: evidence/
          retention-days: 90
