name: ATLAS FS010 R2 Canonical Recovery Offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unpack and verify embedded tests
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PYCODE'
          import gzip,base64,hashlib,pathlib
          data=gzip.decompress(base64.b64decode(''))
          expected='85249cc98633bff8ff060596dfd96b689522aaf8172039f0a0c22061564cf7c3'
          assert hashlib.sha256(data).hexdigest()==expected, 'Embedded tests checksum mismatch'
          pathlib.Path('test_fs010_r2.py').write_bytes(data)
          pathlib.Path('evidence/TEST_SOURCE_SHA256.txt').write_text(expected+'  test_fs010_r2.py\n')
          PYCODE
          python -m py_compile test_fs010_r2.py
      - name: Install verified OpenAI alpha7 wheel
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing | tee evidence/WHEEL_VERIFY.txt
          python -m pip install -q pytest ./openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
          python -c "from importlib.metadata import version; import agents._native; print(version('openai-agents'))" | tee evidence/SDK_VERSION.txt
      - name: Test recovery boundaries
        env:
          NO_PROXY: 127.0.0.1,localhost
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        run: |
          set -o pipefail
          python -m pytest -vv -s test_fs010_r2.py 2>&1 | tee evidence/PYTEST_R2.txt
      - name: Save forensic identity
        if: always()
        run: |
          mkdir -p evidence
          python --version > evidence/PYTHON.txt 2>&1 || true
          echo 'release=v0.24.0-alpha.7 commit=c27b24cc6c4fa7e89ab54fa9f795ef4f2d4d5fb9' > evidence/TARGET.txt
          (cd evidence && sha256sum *.txt > SHA256SUMS.txt) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-FS010-R2-recovery-evidence
          path: evidence/
          retention-days: 90
