name: ATLAS Celery 3430 - solo RabbitMQ baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ATLAS_CELERY_3430_BASELINE.yml'

permissions:
  contents: read

jobs:
  rabbitmq-solo-baseline:
    name: celery-${{ matrix.celery }} / ${{ matrix.ack_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        celery: ['5.6.3', '5.7.0rc1']
        ack_mode: ['early', 'late']
    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: atlas
          RABBITMQ_DEFAULT_PASS: atlaspass
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd 'rabbitmq-diagnostics -q ping'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Celery version
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'celery==${{ matrix.celery }}'
          python -m pip freeze > packages.txt
      - name: Run original-code RabbitMQ solo probe
        env:
          ATLAS_ACK_MODE: ${{ matrix.ack_mode }}
          ATLAS_CELERY_VERSION: ${{ matrix.celery }}
          ATLAS_BROKER_URL: amqp://atlas:atlaspass@127.0.0.1:5672//
        run: |
          cat > atlas_celery_3430.py <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          from urllib import request, parse
          import uuid

          from celery import Celery
          import celery

          MODE = os.environ.get('ATLAS_ACK_MODE', 'early')
          BROKER = os.environ.get('ATLAS_BROKER_URL', 'amqp://atlas:atlaspass@127.0.0.1:5672//')
          QUEUE = os.environ.get('ATLAS_QUEUE', 'atlas3430_default')
          JOURNAL = Path(os.environ.get('ATLAS_JOURNAL', 'task_events.jsonl'))
          DURATION = 32
          HEARTBEAT = 10
          app = Celery('atlas3430', broker=BROKER)
          app.conf.update(
              task_acks_late=(MODE == 'late'),
              broker_heartbeat=HEARTBEAT,
              broker_heartbeat_checkrate=2,
              worker_prefetch_multiplier=1,
              worker_enable_remote_control=False,
              task_ignore_result=True,
              task_serializer='json',
              accept_content=['json'],
              task_default_queue=QUEUE,
          )

          def write_event(event):
              record = {'at': time.time(), **event}
              with JOURNAL.open('a', encoding='utf-8') as f:
                  f.write(json.dumps(record, sort_keys=True) + '\n')
                  f.flush()
                  os.fsync(f.fileno())

          @app.task(name='atlas3430.sleeper', bind=True)
          def sleeper(self, seconds):
              data = {'task_id': self.request.id,
                      'redelivered': bool(self.request.delivery_info.get('redelivered')),
                      'pid': os.getpid()}
              write_event({'type': 'start', **data})
              time.sleep(seconds)
              write_event({'type': 'end', **data})
              return 'done'

          def management(method, queue=None):
              if queue:
                  endpoint = '/api/queues/%2F/' + parse.quote(queue, safe='')
              else:
                  endpoint = '/api/overview'
              url = 'http://127.0.0.1:15672' + endpoint
              auth = base64.b64encode(b'atlas:atlaspass').decode('ascii')
              req = request.Request(url, method=method,
                                    headers={'Authorization': 'Basic ' + auth})
              try:
                  with request.urlopen(req, timeout=3) as response:
                      if method == 'DELETE':
                          return {}
                      return json.load(response)
              except Exception:
                  return None

          def read_events():
              if not JOURNAL.exists():
                  return []
              records = []
              for line in JOURNAL.read_text(encoding='utf-8').splitlines():
                  try:
                      records.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass
              return records

          def run_probe():
              unique = uuid.uuid4().hex[:12]
              queue = 'atlas3430_' + unique
              task_id = 'atlas3430-' + unique
              outdir = Path('evidence')
              outdir.mkdir(exist_ok=True)
              os.environ['ATLAS_QUEUE'] = queue
              os.environ['ATLAS_JOURNAL'] = str(outdir / 'task_events.jsonl')
              worker_env = os.environ.copy()
              # The imported app was configured before queue assignment:
              app.conf.task_default_queue = queue
              journal = Path(worker_env['ATLAS_JOURNAL'])
              if journal.exists():
                  journal.unlink()
              worker_log = (outdir / 'worker.log').open('w', encoding='utf-8')
              worker = subprocess.Popen(
                  [sys.executable, '-m', 'celery', '-A', 'atlas_celery_3430:app',
                   'worker', '--pool=solo', '--concurrency=1', '--loglevel=INFO',
                   '--without-gossip', '--without-mingle', '-Q', queue,
                   '--hostname=atlas3430@%h'],
                  env=worker_env, stdout=worker_log, stderr=subprocess.STDOUT)
              status = 'UNKNOWN'
              reason = ''
              snapshots = []
              started = False
              t0 = None
              try:
                  readiness_deadline = time.monotonic() + 40
                  while time.monotonic() < readiness_deadline:
                      if worker.poll() is not None:
                          raise RuntimeError('worker exited before consuming')
                      state = management('GET', queue)
                      if state and state.get('consumers', 0) >= 1:
                          break
                      time.sleep(.4)
                  else:
                      raise RuntimeError('worker consumer not ready')

                  app.send_task('atlas3430.sleeper', args=[DURATION],
                                task_id=task_id, queue=queue)
                  task_start_deadline = time.monotonic() + 20
                  while time.monotonic() < task_start_deadline:
                      events = read_events()
                      if any(e.get('type') == 'start' for e in events):
                          started = True
                          t0 = next(e['at'] for e in events if e.get('type') == 'start')
                          break
                      if worker.poll() is not None:
                          raise RuntimeError('worker exited before task start')
                      time.sleep(.2)
                  if not started:
                      raise RuntimeError('task did not begin within 20s')

                  deadline = time.monotonic() + (DURATION * 2 + 12)
                  while time.monotonic() < deadline:
                      q = management('GET', queue)
                      snapshots.append({'at': time.time(),
                                        'relative_to_start_s': round(time.time() - t0, 2),
                                        'queue': ({k: q.get(k) for k in
                                                   ('consumers', 'messages_ready',
                                                    'messages_unacknowledged')}
                                                  if q else None),
                                        'worker_running': worker.poll() is None})
                      time.sleep(.5)

                  events = read_events()
                  starts = [x for x in events if x.get('type') == 'start']
                  ends = [x for x in events if x.get('type') == 'end']
                  early = [s for s in snapshots
                           if 4.0 <= s['relative_to_start_s'] <= 8.0 and s['queue']]
                  unacked = [s['queue'].get('messages_unacknowledged') for s in early]
                  unacked = [v for v in unacked if isinstance(v, int)]
                  observed_acked_early = bool(unacked) and all(v == 0 for v in unacked)
                  observed_unacked_early = bool(unacked) and any(v > 0 for v in unacked)
                  duplicate = len(starts) > 1
                  connection_lost_during_task = any(
                      s['queue'].get('consumers') == 0 for s in snapshots
                      if 15 <= s['relative_to_start_s'] <= 28 and s['queue'])
                  if len(starts) == 0 or not early:
                      status, reason = 'INCONCLUSIVE', 'Missing starts or early RabbitMQ samples'
                  elif MODE == 'early':
                      if duplicate or not observed_acked_early:
                          status = 'FAIL_CANDIDATE'
                          reason = 'Duplicate start or broker still unacked during long task'
                      else:
                          status = 'PASS_OBSERVED'
                          reason = 'Broker reports no unacked message while task executes'
                  else:
                      if observed_unacked_early:
                          status = 'CONTROL_PASS'
                          reason = 'Late ACK correctly appears unacked during execution'
                      else:
                          status = 'CONTROL_FAIL'
                          reason = 'Positive control did not show an unacked delivery'
                  result = {
                      'status': status, 'reason': reason,
                      'celery_version_requested': os.environ.get('ATLAS_CELERY_VERSION'),
                      'celery_version_installed': celery.__version__,
                      'ack_mode': MODE, 'broker_heartbeat_timeout_s': HEARTBEAT,
                      'task_duration_s': DURATION, 'queue': queue, 'task_id': task_id,
                      'task_starts': len(starts), 'task_ends': len(ends),
                      'redelivered_starts': sum(x.get('redelivered', False) for x in starts),
                      'observed_acked_early': observed_acked_early,
                      'connection_lost_during_task': connection_lost_during_task,
                      'observed_unacked_early': observed_unacked_early,
                      'early_unacked_samples': unacked,
                      'snapshots': snapshots, 'events': events,
                      'limitations': [
                          'No Consumer ACK confirm exists in AMQP 0-9-1',
                          'No crash/restart or network fault is injected',
                          'One controlled long task, not proof of general correctness',
                          'This probe does not change Celery source code',
                      ]}
                  (outdir / 'result.json').write_text(json.dumps(result, indent=2),
                                                      encoding='utf-8')
                  print(json.dumps({k: v for k, v in result.items()
                                    if k not in ('snapshots', 'events')}, indent=2))
              except Exception as exc:
                  status = 'BLOCKED'
                  reason = repr(exc)
                  (outdir / 'result.json').write_text(json.dumps(
                      {'status': status, 'reason': reason, 'ack_mode': MODE,
                       'celery_version': celery.__version__}, indent=2),
                      encoding='utf-8')
                  print('BLOCKED:', reason, file=sys.stderr)
              finally:
                  if worker.poll() is None:
                      worker.terminate()
                      try:
                          worker.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          worker.kill()
                          worker.wait(timeout=5)
                  worker_log.close()
                  management('DELETE', queue)
              # Status always in artifact: failing behavior is a measurement,
              # not an infrastructure failure. Fail the job only when blocked.
              return 2 if status == 'BLOCKED' else 0

          if __name__ == '__main__':
              sys.exit(run_probe())
          PY
          python atlas_celery_3430.py
      - name: Artifact and exact dependency set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celery3430-${{ matrix.celery }}-${{ matrix.ack_mode }}
          path: |
            evidence/
            packages.txt
          if-no-files-found: warn
