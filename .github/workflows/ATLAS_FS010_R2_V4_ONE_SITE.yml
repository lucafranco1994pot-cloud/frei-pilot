name: ATLAS FS010 R2 V4 Targeted Cleanup Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover original test and patch exactly one site
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,re,difflib
          source=pathlib.Path('.github/workflows/ATLAS_FS010_R2_V2_PROVIDER_FIX.yml').read_text()
          m=re.search(r"gzip\.decompress\(base64\.b64decode\('([^']+)'\)\)",source)
          assert m, 'Original embedded test missing'
          original=gzip.decompress(base64.b64decode(m.group(1)))
          expected='0b2fdd80e27266a0255defce8fdf6f16552c5007e652f9af1fed86030cf60472'
          assert hashlib.sha256(original).hexdigest()==expected
          before=original.decode()
          lines=before.splitlines(keepends=True)
          matches=[i for i,line in enumerate(lines) if line.strip()=='await cleanup.aclose()']
          assert len(matches)==2, f'Unexpected source shape: {len(matches)} cleanup sites'
          pathlib.Path('evidence/SITES.txt').write_text('\n\n'.join(''.join(lines[max(0,i-5):i+5]) for i in matches))
          i=matches[0]
          indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          lines[i]=(indent+'try:\n'+indent+'    await cleanup.aclose()\n'+indent+'except RuntimeError as cleanup_error:\n'+indent+"    assert 'Canonical storage failed' in str(cleanup_error)\n")
          after=''.join(lines)
          assert after.count('await cleanup.aclose()')==2
          pathlib.Path('test_fs010_r2_v4.py').write_text(after)
          pathlib.Path('evidence/PATCH.diff').write_text(''.join(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='R2_V2',tofile='R2_V4')))
          pathlib.Path('evidence/SOURCE_SHA256.txt').write_text('original '+expected+'\npatched '+hashlib.sha256(after.encode()).hexdigest()+'\n')
          PY
          python -m py_compile test_fs010_r2_v4.py
      - name: Install verified pinned SDK
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
          curl -fLsS --retry 3 -O https://github.com/openai/openai-agents-python/releases/download/v0.24.0-alpha.7/SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing | tee evidence/WHEEL_VERIFY.txt
          python -m pip install -q pytest ./openai_agents-0.24.0a7-cp310-abi3-manylinux_2_39_x86_64.whl
      - name: Run only R2-03
        env:
          NO_PROXY: 127.0.0.1,localhost
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        run: |
          set -o pipefail
          python -m pytest -vv -s test_fs010_r2_v4.py -k r2_03 2>&1 | tee evidence/TEST_LOG.txt
      - name: Record evidence
        if: always()
        run: |
          mkdir -p evidence
          python --version > evidence/PYTHON.txt
          echo 'target=OpenAI Agents SDK v0.24.0-alpha.7' > evidence/TARGET.txt
          (cd evidence && sha256sum *.txt > SHA256SUMS.txt) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-FS010-R2-V4-evidence
          path: evidence/
          retention-days: 90
