name: CCXT Originaltest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract frozen test package
        run: unzip -oq ccxt-test.zip
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify inputs
        run: python verify_inputs.py
      - name: Install CCXT
        run: python -m pip install -r ccxt_pilot_001/requirements.txt
      - name: Execute original parser
        working-directory: ccxt_pilot_001
        run: python run_original.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccxt-original-evidence
          path: |
            ccxt_pilot_001/original_run.json
            ccxt_pilot_001/fixture.json
            ccxt_pilot_001/requirements.txt
            ccxt_pilot_001/run_original.py
          if-no-files-found: warn
