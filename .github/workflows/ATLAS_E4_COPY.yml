        run: |
          set -euo pipefail
          test "$(git -C nats rev-parse HEAD)" = dc55f4b43293fd1a4906b9acd0060e3298ebac0f
          # Gzip source is deterministic; the exact decoded Go file is SHA-256 pinned.
