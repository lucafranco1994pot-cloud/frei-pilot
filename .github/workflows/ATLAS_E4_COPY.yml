# ATLAS E4: supported R3 -> offline follower -> delete G1 -> recreate G2 R1
# -> rejoin follower -> scale G2 to R3 -> full restart; no logger barrier.
# Diagnostic safety control, NOT a confirmed production defect.
name: ATLAS E4 Supported G1 G2 Rejoin Safety
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation-rejoin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned NATS revision
        uses: actions/checkout@v4
        with:
          repository: nats-io/nats-server
          ref: dc55f4b43293fd1a4906b9acd0060e3298ebac0f
          path: nats
          persist-credentials: false
      - name: Setup Go from pinned go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: nats/go.mod
          cache: false
      - name: Build independent supported-lifecycle test
