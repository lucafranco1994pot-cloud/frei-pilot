          ATLAS_E4_GZIP
          echo '63f6607050fabc6e5d137e9edbd0c813428296bc1ff2d41236e08ae4bf7e839e  nats/server/atlas_e4_generation_rejoin_test.go' | sha256sum --check
          test -z "$(gofmt -l nats/server/atlas_e4_generation_rejoin_test.go)"
          test -z "$(git -C nats diff --name-only)"
          git -C nats rev-parse HEAD | tee atlas-e4-upstream-commit.txt
          go version | tee atlas-e4-go-version.txt
          sha256sum nats/server/atlas_e4_generation_rejoin_test.go | tee atlas-e4-source-sha256.txt
      - name: Run only supported generation-rejoin test
        shell: bash
        run: |
          set +e
          set -o pipefail
          (cd nats && go test ./server -run '^TestAtlasE4SupportedGenerationRejoin$' -count=1 -timeout=13m -v) 2>&1 | tee atlas-e4-native.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > atlas-e4-native.exit
          echo "ATLAS_E4_GO_EXIT=$rc"
          exit 0
      - name: Independent classification from runtime evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'ATLAS_E4_AUDIT' | tee atlas-e4-audit.txt
          from pathlib import Path
          import re
          p=Path('atlas-e4-native.log')
          s=p.read_text(errors='replace') if p.is_file() else ''
          try: rc=int(Path('atlas-e4-native.exit').read_text().strip())
          except (OSError,ValueError): rc=-999
          name='TestAtlasE4SupportedGenerationRejoin'
          starts=len(re.findall(r'^=== RUN\s+'+name+r'\s*$',s,re.M))
          passed=len(re.findall(r'^--- PASS: '+name+r' \(',s,re.M))
          failed=len(re.findall(r'^--- FAIL: '+name+r' \(',s,re.M))
          required=[
            'ATLAS_E4_G1_LOCAL_PROVEN=true',
            'ATLAS_E4_G1_FOLLOWER_OFFLINE=true',
            'ATLAS_E4_G1_PUBLIC_DELETE_ACKED=true',
            'ATLAS_E4_G2_PUBLIC_CREATED_READABLE=true',
            'ATLAS_E4_OLD_G1_FOLLOWER_REJOINED=true',
            'ATLAS_E4_G2_LOCAL_GENERATION_PROVEN=true',
            'ATLAS_E4_G2_PUBLIC_READABLE_AFTER_REJOIN=true',
            'ATLAS_E4_G2_PUBLIC_READABLE_AFTER_FULL_RESTART=true',
            'ATLAS_E4_VERDICT=SUPPORTED_GENERATION_REJOIN_SAFETY_CONTROL_PASS'
          ]
          # Log markers are derived from unique event lines; they cannot substitute for Go exit and test completion.
          counts={m:s.count(m) for m in required}
          fatal_events=any(('BLOCKED_' in line or 'SAFETY_VIOLATION' in line or 'INVALID_' in line) for line in s.splitlines())
          complete=rc==0 and starts==1 and passed==1 and failed==0 and not fatal_events and all(n==1 for n in counts.values())
          print('ATLAS_E4_GO_EXIT='+str(rc))
          print('ATLAS_E4_TEST_STARTS='+str(starts))
          print('ATLAS_E4_TEST_PASSES='+str(passed))
          print('ATLAS_E4_TEST_FAILS='+str(failed))
          for k,v in counts.items():print('ATLAS_E4_EVENT='+k+' count='+str(v))
          for line in s.splitlines():
            if 'BLOCKED_' in line or 'SAFETY_VIOLATION' in line or 'INVALID_' in line:
              print('ATLAS_E4_ERROR='+line.strip()[:500])
          print('ATLAS_E4_ORIGIN=SUPPORTED_R3_OFFLINE_PUBLIC_DELETE_R1_RECREATE_R3_SCALEUP')
          print('ATLAS_E4_SCHEDULE=NO_LOGGER_BARRIER')
          print('ATLAS_E4_PRODUCT_CODE=UNMODIFIED')
          print('ATLAS_E4_VERDICT='+('SAFETY_CONTROL_PASS' if complete else 'BLOCKED_OR_POSSIBLE_VIOLATION_REQUIRES_LOG_REVIEW'))
          ATLAS_E4_AUDIT
      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'atlas-e4-*' ! -name 'atlas-e4-evidence-sha256.txt' -print0 | sort -z | xargs -0 -r sha256sum > atlas-e4-evidence-sha256.txt
          sha256sum nats/server/atlas_e4_generation_rejoin_test.go >> atlas-e4-evidence-sha256.txt
          sha256sum --check atlas-e4-evidence-sha256.txt | tee atlas-e4-hash-check.txt
      - name: Archive regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e4-supported-generation-rejoin
          path: |
            atlas-e4-*
            nats/server/atlas_e4_generation_rejoin_test.go
          if-no-files-found: warn
          retention-days: 90
      - name: Fail closed if safety control did not pass
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'ATLAS_E4_VERDICT=SAFETY_CONTROL_PASS' atlas-e4-audit.txt
          sha256sum --check atlas-e4-evidence-sha256.txt >/dev/null
          echo 'ATLAS_E4_FINAL=PASS_ON_PINNED_COMMIT_ONLY'
