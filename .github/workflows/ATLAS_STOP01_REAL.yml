name: ATLAS STOP-01 REAL - Step 1 boot only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-stop01-step1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  boot-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare isolated boot harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lab proof
          chmod 777 proof
          cat > lab/boot-probe.cjs <<'JS'
          'use strict';
          const fs=require('node:fs'),Module=require('node:module');
          let seq=0;
          function log(kind,data={}){fs.appendFileSync('/capture/boot-hooks.jsonl',JSON.stringify({seq:++seq,kind,pid:process.pid,...data})+'\n');}
          log('preload_started',{node:process.version});
          const load=Module._load,done=new WeakSet();
          const targets=[['active-workflow-manager.js','ActiveWorkflowManager','init'],['scheduled-task-manager.js','ScheduledTaskManager','registerCron'],['workflow-execution.service.js','WorkflowExecutionService','runWorkflow'],['active-executions.js','ActiveExecutions','add']];
          Module._load=function(request,parent,isMain){
            const value=load.apply(this,arguments);let file;
            try{file=Module._resolveFilename(request,parent);}catch{return value;}
            if(typeof file!=='string')return value;
            for(const [suffix,klass,method] of targets){
              if(!file.replaceAll('\\','/').endsWith('/'+suffix))continue;
              const proto=value?.[klass]?.prototype,original=proto?.[method];
              if(typeof original!=='function'||done.has(original))continue;
              const wrapped=function(...args){if(method==='init')log('main_init_enter');return original.apply(this,args);};
              done.add(wrapped);proto[method]=wrapped;log('hook_installed',{klass,method,file});
            }
            return value;
          };
          process.on('exit',code=>log('process_exit',{code}));
          JS
          cat > lab/receiver.py <<'PY'
          import json,sqlite3,uuid
          from http.server import BaseHTTPRequestHandler,HTTPServer
          instance=str(uuid.uuid4());db=sqlite3.connect('/capture/receiver.sqlite')
          db.execute('PRAGMA journal_mode=DELETE');db.execute('PRAGMA synchronous=FULL')
          db.execute('CREATE TABLE receipts(seq INTEGER PRIMARY KEY,body TEXT)');db.commit()
          class Handler(BaseHTTPRequestHandler):
              def log_message(self,*args):pass
              def respond(self,value):
                  body=json.dumps(value).encode();self.send_response(200);self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
              def do_GET(self):
                  if self.path!='/ready':self.send_error(404);return
                  self.respond({'ready':True,'instance':instance})
              def do_POST(self):
                  if self.path!='/control':self.send_error(404);return
                  try:
                      size=int(self.headers.get('Content-Length',0))
                      if not 0<size<=4096:raise ValueError()
                      value=json.loads(self.rfile.read(size))
                  except (ValueError,TypeError):self.send_error(400);return
                  with db:cursor=db.execute('INSERT INTO receipts(body) VALUES(?)',(json.dumps(value,sort_keys=True),))
                  self.respond({'receipt_id':cursor.lastrowid,'committed':True,'instance':instance})
          HTTPServer(('0.0.0.0',8787),Handler).serve_forever()
          PY
          cat > proof/scope.json <<'JSON'
          {"phase":"BOOT_ONLY","product_verdict":"NOT_TESTED","stop01_reproduced":false,"adapter":"boot compatibility subset, no stop or effect measurement","identity_limit":"source tag and runtime package version checked separately; image build equivalence not independently established"}
          JSON
          sha256sum lab/* > proof/harness.sha256
      - name: Resolve container digests and verify release identity
        shell: bash
        run: |
          set -euo pipefail
          : > proof/images.lock
          for spec in 'N8N docker.n8n.io/n8nio/n8n:1.123.87' 'POSTGRES postgres:16.6-alpine' 'PYTHON python:3.12.8-alpine'; do
            read -r key tag <<< "$spec"
            docker pull --platform linux/amd64 "$tag" 2>&1 | tee "proof/pull-${key}.log"
            digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s\n' "$key" "$digest" | tee -a proof/images.lock >> "$GITHUB_ENV"
            docker image inspect "$digest" --format '{{json .Config.Labels}}' > "proof/image-labels-${key}.json"
          done
          git ls-remote https://github.com/n8n-io/n8n.git 'refs/tags/n8n@1.123.87' 'refs/tags/n8n@1.123.87^{}' > proof/source-tag.txt
          python3 - <<'PY'
          from pathlib import Path
          rows=[line.split() for line in Path('proof/source-tag.txt').read_text().splitlines()]
          assert rows,'release tag unresolved'
          peeled=[r[0] for r in rows if r[1].endswith('^{}')]
          sha=peeled[0] if peeled else rows[0][0]
          assert sha=='959e68f655116f6dad303d6a8a975469c86f714e',sha
          PY
      - name: Start disposable PostgreSQL, receiver and n8n
        shell: bash
        run: |
          set -euo pipefail
          docker network create atlas-stop01-lab
          printf 'atlas-lab-only\n' > lab/pg-password
          chmod 644 lab/pg-password
          docker run -d --name atlas-stop01-pg --network atlas-stop01-lab \
            -e POSTGRES_USER=atlas -e POSTGRES_DB=atlas -e POSTGRES_PASSWORD_FILE=/run/lab-password \
            -v "$PWD/lab/pg-password:/run/lab-password:ro" "$POSTGRES"
          docker run -d --name atlas-stop01-receiver --network atlas-stop01-lab \
            -v "$PWD/lab:/lab:ro" -v "$PWD/proof:/capture" "$PYTHON" python /lab/receiver.py
          for i in $(seq 1 60); do
            if docker exec atlas-stop01-pg pg_isready -U atlas -d atlas; then break; fi
            sleep 2
          done
          docker exec atlas-stop01-pg pg_isready -U atlas -d atlas
          docker run -d --name atlas-stop01-main --network atlas-stop01-lab \
            -v "$PWD/lab:/lab:ro" -v "$PWD/proof:/capture" \
            -e NODE_OPTIONS=--require=/lab/boot-probe.cjs \
            -e DB_TYPE=postgresdb -e DB_POSTGRESDB_HOST=atlas-stop01-pg \
            -e DB_POSTGRESDB_DATABASE=atlas -e DB_POSTGRESDB_USER=atlas \
            -e DB_POSTGRESDB_PASSWORD_FILE=/lab/pg-password \
            -e EXECUTIONS_MODE=regular -e GENERIC_TIMEZONE=Etc/UTC \
            -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            -e N8N_TEMPLATES_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true \
            -e EXECUTIONS_DATA_SAVE_ON_SUCCESS=all -e EXECUTIONS_DATA_SAVE_ON_ERROR=all \
            -e EXECUTIONS_DATA_PRUNE=false "$N8N" start
      - name: Verify only startup, hook installation and receiver control
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e NODE_OPTIONS= atlas-stop01-main node -p 'process.version' > proof/node-version.txt
          docker exec -e NODE_OPTIONS= atlas-stop01-main n8n --version > proof/n8n-version.txt
          grep -Eq '^1\.123\.87$' proof/n8n-version.txt
          for i in $(seq 1 90); do
            if docker exec -e NODE_OPTIONS= atlas-stop01-main node -e "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 2
          done
          docker exec -e NODE_OPTIONS= atlas-stop01-main node -e "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker exec atlas-stop01-receiver python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8787/ready').read().decode())" > proof/receiver-ready.json
          docker exec atlas-stop01-receiver python -c "import urllib.request; q=urllib.request.Request('http://127.0.0.1:8787/control',data=b'{\"phase\":\"boot-only\"}',headers={'Content-Type':'application/json'}); print(urllib.request.urlopen(q).read().decode())" > proof/receiver-control.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[json.loads(s) for s in Path('proof/boot-hooks.jsonl').read_text().splitlines()]
          required={('ActiveWorkflowManager','init'),('ScheduledTaskManager','registerCron'),('WorkflowExecutionService','runWorkflow'),('ActiveExecutions','add')}
          installed={(e.get('klass'),e.get('method')) for e in rows if e['kind']=='hook_installed'}
          assert required<=installed,{'missing':sorted(required-installed)}
          assert any(e['kind']=='main_init_enter' for e in rows),'main init not entered'
          assert len({e['pid'] for e in rows})==1,'mixed observer processes'
          assert json.loads(Path('proof/receiver-control.json').read_text())['committed'] is True
          Path('proof/boot-result.json').write_text(json.dumps({'boot_preflight':'PASS','product_verdict':'NOT_TESTED','hooks_installed':sorted(required),'hooks_exercised':['ActiveWorkflowManager.init'],'no_stop01_reproduction':True},indent=2))
          PY
      - name: Always save logs and stop laboratory
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p proof
          for c in atlas-stop01-main atlas-stop01-receiver atlas-stop01-pg; do
            docker logs --timestamps "$c" > "proof/${c}.log" 2>&1
            docker inspect "$c" --format '{{json .State}}' > "proof/${c}-state-before-stop.json" 2>&1
            docker stop -t 30 "$c" > "proof/${c}-stop.txt" 2>&1
            docker logs --timestamps "$c" > "proof/${c}-final.log" 2>&1
            docker inspect "$c" --format '{{json .State}}' > "proof/${c}-state-after-stop.json" 2>&1
          done
          if [ ! -f proof/boot-result.json ]; then
            printf '{"boot_preflight":"BLOCKED","product_verdict":"NOT_TESTED"}\n' > proof/boot-result.json
          fi
          find proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > proof/SHA256SUMS
          cat proof/boot-result.json >> "$GITHUB_STEP_SUMMARY"
          for c in atlas-stop01-main atlas-stop01-receiver atlas-stop01-pg; do docker rm -f "$c" >/dev/null 2>&1; done
          docker network rm atlas-stop01-lab >/dev/null 2>&1
          exit 0
      - name: Upload boot evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-stop01-step1-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: warn
          retention-days: 14
