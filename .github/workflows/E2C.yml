# IMPORTANT: Diagnostic runner alters temporary jetstream_cluster.go with log-only probes.
# Controls: authorized DOOMED delete, protected ATLAS remains fully readable; no corruption.
name: ATLAS NATS E2C Trace Actual Delete Decision

on:
  workflow_dispatch:

permissions:
  contents: read

