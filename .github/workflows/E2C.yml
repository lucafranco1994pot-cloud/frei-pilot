      - name: Apply six explicitly disclosed LOGGING-ONLY probes in runner copy
        shell: bash
        run: |
          set -euo pipefail
          python3 atlas-e2c-instrument.py | tee atlas-e2c-patch-info.txt
          git -C nats diff -- server/jetstream_cluster.go > atlas-e2c-diagnostic-source.diff
          test -s atlas-e2c-diagnostic-source.diff
          test -z "$(gofmt -l nats/server/jetstream_cluster.go)"
          test "$(git -C nats diff --name-only)" = 'server/jetstream_cluster.go'
          cp nats/server/jetstream_cluster.go atlas-e2c-instrumented-jetstream_cluster.go
          sha256sum nats/server/jetstream_cluster.go atlas-e2c-diagnostic-source.diff | tee -a atlas-e2c-patch-info.txt
          echo 'ATLAS_E2C_DIAGNOSTIC_DIFF_ONLY=server/jetstream_cluster.go' | tee -a atlas-e2c-patch-info.txt
      - name: Run one five-server E2C diagnostic test
        id: diagnostic
        shell: bash
        working-directory: nats
        env:
          ATLAS_E2C_EVIDENCE_DIR: ${{ github.workspace }}/atlas-e2c-raw
        run: |
          set +e
          set -o pipefail
          go test ./server -run '^TestAtlasE2CDeletionDecisionTrace$' -count=1 -timeout=20m -covermode=atomic -coverprofile=../atlas-e2c-coverage.out -v > ../atlas-e2c-test.log 2> ../atlas-e2c-stderr.txt
          rc=$?
          echo "$rc" > ../atlas-e2c-go-test.exit
          echo "ATLAS_E2C_GO_TEST_EXIT=$rc"
          exit "$rc"
      - name: Classify decision evidence without treating diagnostic as pristine product
        if: always()
        shell: bash
        run: |
          python3 - <<'PYAUDIT' | tee atlas-e2c-audit.txt
          from pathlib import Path
          import re, hashlib
          log = Path('atlas-e2c-test.log').read_text(errors='replace') if Path('atlas-e2c-test.log').exists() else ''
          def flagged(label,pattern):
              val=bool(re.search(pattern,log))
              print('ATLAS_E2C_CHECK=%s passed=%s'%(label,str(val).lower()))
              return val
          print('ATLAS_E2C_SCOPE=instrumented_diagnostic_not_unmodified_upstream')
          print('ATLAS_E2C_AUTHORISATION=only_DOOMED_deleted_via_client_API')
          print('ATLAS_E2C_TEST_SHA256=d2b9ced277233f8387fa3900bdcaf7606216289b7c06e0e09e2ba0d0c706c8f5')
          try: rc=int(Path('atlas-e2c-go-test.exit').read_text().strip())
          except (ValueError,OSError):rc=-999
          print('ATLAS_E2C_GO_TEST_EXIT=%d'%rc)
          checks={
            'selected_test':flagged('selected_test',r'=== RUN\s+TestAtlasE2CDeletionDecisionTrace\b'),
            'passed_test':flagged('passed_test',r'--- PASS: TestAtlasE2CDeletionDecisionTrace'),
            'authorized_delete':flagged('authorized_delete',r'ATLAS_E2C_AUTHORIZED_DELETE stream=DOOMED .*err=nil'),
            'transfer':flagged('transfer',r'ATLAS_E2C_TRANSFER_PROOF .*payload_identical=true'),
            'target_identity':flagged('target_identity',r'ATLAS_E2C_LOCAL_META_ASSIGNMENT .*stream=ATLAS .*consistent=true'),
            'decision_trace':flagged('decision_trace',r'ATLAS_E2C_DECISION_AUDIT .*control_validly_deleted=true ATLAS_protected=true'),
            'result':flagged('result',r'ATLAS_E2C_VERDICT=LEGITIMATE_DELETION_TRACED_ATLAS_PRESERVED'),
          }
          print('ATLAS_E2C_TRACE_LIMIT=only_target_logs_and_test_coverage_not_production_no_instrumentation')
          print('ATLAS_E2C_SAFETY_LIMIT=no_wrong_delete_in_this_control_not_disproof_of_issue_7556')
          verdict='DIAGNOSTIC_CONTROL_PASS' if rc==0 and all(checks.values()) else 'NOT_PROVEN_OR_FAIL'
          print('ATLAS_E2C_AUDIT_VERDICT='+verdict)
          PYAUDIT
          {
            echo '=== E2C scope and audit ==='
            test -f atlas-e2c-audit.txt && cat atlas-e2c-audit.txt || true
            echo '=== E2C critical test evidence ==='
            grep -E 'ATLAS_E2C_(VERDICT|DECISION_AUDIT|CONTROL_AFTER|AUTHORIZED_DELETE|TRANSFER_PROOF|METADATA_APPLICATION)|^--- (PASS|FAIL):' atlas-e2c-test.log 2>/dev/null || true
            echo '=== Instrumentation provenance ==='
            cat atlas-e2c-patch-info.txt 2>/dev/null || true
          } | tee atlas-e2c-summary.txt
          cat atlas-e2c-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Hash preserved materials
        if: always()
        shell: bash
        run: |
          find . -maxdepth 2 -type f \( -name 'atlas-e2c-*' -o -name '*snapshot.bin' -o -name '*manifest.tsv' \) -print0 | sort -z | xargs -0 -r sha256sum > atlas-e2c-evidence-sha256.txt
          cat atlas-e2c-evidence-sha256.txt | tail -n 35
      - name: Upload complete E2C evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e2c-explicitly-instrumented-decision-trace
          path: |
            atlas-e2c-inputs.txt
            atlas-e2c-patch-info.txt
            atlas-e2c-instrument.py
            atlas-e2c-original-jetstream_cluster.go
            atlas-e2c-instrumented-jetstream_cluster.go
            atlas-e2c-diagnostic-source.diff
            atlas-e2c-test.log
            atlas-e2c-stderr.txt
            atlas-e2c-go-test.exit
            atlas-e2c-coverage.out
            atlas-e2c-audit.txt
            atlas-e2c-summary.txt
            atlas-e2c-evidence-sha256.txt
            atlas-e2c-raw/**
            nats/server/atlas_e2c_decision_trace_test.go
          if-no-files-found: warn
          retention-days: 14
