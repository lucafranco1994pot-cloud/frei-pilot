          (cd nats && go build -o ../atlas-e2e-server .)
          (cd nats && go build -o ../atlas-e2e-client ./atlas_e2e_client)
          test -x atlas-e2e-server
          test -x atlas-e2e-client
          ./atlas-e2e-server -v | tee atlas-e2e-server-version.txt
          sha256sum atlas-e2e-server atlas-e2e-client | tee atlas-e2e-binary-hashes.txt
          test -z "$(git -C nats diff --name-only)"
