        shell: bash
        env:
          ATLAS_E2E_WORK_DIR: ${{ github.workspace }}/atlas-e2e-work
          ATLAS_E2E_EVIDENCE_DIR: ${{ github.workspace }}/atlas-e2e-raw
          ATLAS_E2E_SERVER_BIN: ${{ github.workspace }}/atlas-e2e-server
          ATLAS_E2E_CLIENT_BIN: ${{ github.workspace }}/atlas-e2e-client
        run: |
          set +e
          python3 atlas-e2e-hard-crash.py > atlas-e2e-test.log 2> atlas-e2e-test-stderr.txt
          rc=$?
          printf '%s\n' "$rc" > atlas-e2e-driver.exit
          echo "ATLAS_E2E_DRIVER_EXIT=$rc"
          exit "$rc"
      - name: Audit executed operations and explicitly classify partial evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'ATLAS_E2E_AUDIT' | tee atlas-e2e-audit.txt
          import json,hashlib
          from pathlib import Path
          root=Path('.')
          evidence=root/'atlas-e2e-raw'
          try:
              data=json.loads((evidence/'result.json').read_text())
          except (FileNotFoundError,ValueError) as e:
              data={'verdict':'BLOCKED_NO_RESULT_JSON','failure':str(e),'observations':{},'preconditions':{}}
          try: rc=int((root/'atlas-e2e-driver.exit').read_text().strip())
          except (OSError,ValueError): rc=-999
          obs=data.get('observations',{})
          prec=data.get('preconditions',{})
          mutations=obs.get('mutations',{})
          exits=obs.get('hard_crash_exitcodes',{})
          log=obs.get('log_evidence',{})
          mreads=obs.get('majority_read_while_minority_down',{})
          healthy=['S-1','S-4','S-5']
          checks={
           'frozen_source_unchanged':(root/'atlas-e2e-inputs.txt').exists() and 'ATLAS_E2E_SOURCE_MODIFICATIONS=NONE' in (root/'atlas-e2e-inputs.txt').read_text(),
           'two_verified_single_bit_faults':set(mutations)=={'S-2','S-3'} and all(x['exactly_one_bit'] and x['running'] for x in mutations.values()),
           'two_genuine_sigkill_exits':exits=={'S-2':-9,'S-3':-9},
           '100_confirmed_original_writes':prec.get('100_confirmed_acks') is True and (evidence/'ack-manifest.txt').is_file(),
           'five_initial_local_store_dirs':prec.get('five_stream_directories') is True,
           'three_healthy_read_during_crashes':set(mreads)==set(healthy) and all(mreads[n]==0 for n in healthy),
           'three_healthy_stores_after':obs.get('safe_majority_stores') is True,
           'three_healthy_reads_after':obs.get('healthy_three_routed_api_readable') is True,
           'no_protected_stream_directory_erasure':obs.get('protected_stream_directories_erased')==[],
           'corrupt_snapshot_read_error_observed':obs.get('actual_corrupt_snapshot_read_error_logged') is True,
           'driver_exit_zero':rc==0,
           'guard_verdict':data.get('verdict')=='CORRUPT_SNAPSHOT_REJECTED_NO_UNAUTHORIZED_ERASURE_OBSERVED',
          }
          print('ATLAS_E2E_DRIVER_EXIT='+str(rc))
          print('ATLAS_E2E_HARNESS_VERDICT='+str(data.get('verdict')))
          for k,v in checks.items():print('ATLAS_E2E_CHECK='+k+' passed='+str(v).lower())
          print('ATLAS_E2E_AUDIT_VERDICT='+('SAFE_CRASH_CONTROL_PASS' if all(checks.values()) else 'BLOCKED_OR_RED_CANDIDATE_REVIEW_EVIDENCE'))
          print('ATLAS_E2E_LIMIT=process_failure_and_snapshot_placement_only_no_mandated_meta_leader_election')
          print('ATLAS_E2E_LIMIT=not_a_reproduction_or_fix_of_issue_7556')
          ATLAS_E2E_AUDIT
          {
            cat atlas-e2e-audit.txt
            grep -E '^ATLAS_E2E_(CONFIG_READY|ACKS|BITFLIP|KILL_VERIFIED|RESTART_ATTEMPT|MAJORITY_DURING_CRASH|DISK_STATE|LOG_SUMMARY|API_RESULT|VERDICT|BLOCKED|FINAL)' atlas-e2e-test.log 2>/dev/null || true
          } | tee atlas-e2e-summary.txt
          cat atlas-e2e-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Hash and verify all collected human-readable and raw evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ATLAS_E2E_HASH'
          from pathlib import Path
          import hashlib
          root=Path('.')
          manifest=root/'atlas-e2e-evidence-sha256.txt'
          excluded={manifest,root/'atlas-e2e-manifest-check.txt'}
          files={p for p in root.glob('atlas-e2e-*') if p.is_file() and p not in excluded and p.suffix not in ('.pyc',)}
          raw=root/'atlas-e2e-raw'
          if raw.exists():files.update(p for p in raw.rglob('*') if p.is_file())
          goclient=root/'nats/atlas_e2e_client/main.go'
          if goclient.is_file():files.add(goclient)
          required=['atlas-e2e-inputs.txt','atlas-e2e-test.log','atlas-e2e-driver.exit','atlas-e2e-audit.txt','atlas-e2e-summary.txt','atlas-e2e-server-version.txt','atlas-e2e-binary-hashes.txt','atlas-e2e-hard-crash.py','nats/atlas_e2e_client/main.go']
          missing=[name for name in required if not (root/name).is_file()]
          manifest.write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in sorted(files)),encoding='utf8')
          print('ATLAS_E2E_MANIFEST_SELF_INCLUDED='+str(manifest in files).lower())
          print('ATLAS_E2E_MANIFEST_FILE_COUNT='+str(len(files)))
          print('ATLAS_E2E_MISSING_REQUIRED='+(','.join(missing) if missing else 'NONE'))
          if missing:raise SystemExit(3)
          ATLAS_E2E_HASH
          sha256sum --check atlas-e2e-evidence-sha256.txt | tee atlas-e2e-manifest-check.txt
      - name: Preserve all captured evidence even if the experiment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e2e-b1-five-real-processes-evidence
          path: |
            atlas-e2e-inputs.txt
            atlas-e2e-server-version.txt
            atlas-e2e-binary-hashes.txt
            atlas-e2e-hard-crash.py
            nats/atlas_e2e_client/main.go
            atlas-e2e-test.log
            atlas-e2e-test-stderr.txt
            atlas-e2e-driver.exit
            atlas-e2e-audit.txt
            atlas-e2e-summary.txt
            atlas-e2e-evidence-sha256.txt
            atlas-e2e-manifest-check.txt
            atlas-e2e-raw/**
          if-no-files-found: warn
          retention-days: 14
      - name: Mandatory final classification and integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'ATLAS_E2E_AUDIT_VERDICT=SAFE_CRASH_CONTROL_PASS' atlas-e2e-audit.txt
          test -s atlas-e2e-evidence-sha256.txt
          test -s atlas-e2e-manifest-check.txt
          sha256sum --check atlas-e2e-evidence-sha256.txt >/dev/null
          echo 'ATLAS_E2E_FINAL_GATE=PASS'
