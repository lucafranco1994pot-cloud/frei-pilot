      - name: Freeze runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'NATS HEAD:'
            git -C nats rev-parse HEAD
            echo 'Go:'
            go version
            echo 'Test SHA256:'
            sha256sum nats/server/atlas_extreme_01_diagnostic_test.go
            echo 'Checkout modifications:'
            git -C nats status --porcelain
          } | tee atlas-f1d-inputs.log
          test "$(git -C nats rev-parse HEAD)" = 'd163ae747ad050ea89054f8fb03c43e64e737aea'

      - name: Execute diagnosis once (no product changes)
        id: diagnose
        working-directory: nats
        shell: bash
        env:
          ATLAS_DIAG_EVIDENCE_DIR: ${{ github.workspace }}/atlas-f1d-raw
        run: |
          set +e
          set -o pipefail
          go test ./server -run '^TestAtlasExtreme01DiagnosticMeta$' -count=1 -timeout=15m -v 2>&1 | tee ../atlas-f1d-test.log
          rc=${PIPESTATUS[0]}
          echo "GO_TEST_EXIT=$rc" | tee -a ../atlas-f1d-test.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Export exact diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '=== GO TEST EXIT ==='
            echo "${{ steps.diagnose.outputs.exit_code }}"
            echo '=== ALL INPUTS ==='
            test -f atlas-f1d-inputs.log && cat atlas-f1d-inputs.log || echo 'BLOCKED: input log missing'
            echo '=== TEST LOG HASH ==='
            test -f atlas-f1d-test.log && sha256sum atlas-f1d-test.log || echo 'BLOCKED: test log missing'
            echo '=== DIAGNOSIS ==='
            if [ -f atlas-f1d-test.log ]; then
              grep -E 'ATLAS_DIAG_META|ATLAS_DIAG_LOGGER|ATLAS_DIAG_START|ATLAS_DIAG_SERVER_LOG|ATLAS_DIAG_API_SUMMARY|ATLAS_DIAG_API_ERROR|ATLAS_DIAG_EVIDENCE|ATLAS_VERDICT|ATLAS_RESULT|ATLAS_RESTART|--- (PASS|FAIL|SKIP)|^FAIL|GO_TEST_EXIT|BLOCKED' atlas-f1d-test.log | tail -n 400 || true
            fi
          } | tee atlas-f1d-summary.txt
          {
            echo '# ATLAS F1D diagnosis — never infer data loss from a timeout'
            echo 'NATS product baseline unchanged: `d163ae747ad050ea89054f8fb03c43e64e737aea`'
            echo 'Test SHA256: `a30027c8363576e3fd0c1133aa69c5a9d62aae0dbebaaa8e890e3299bcd6878f`'
            echo 'F1B original remains unchanged. A green job is not automatic proof of recovery.'
            echo '```'
            cat atlas-f1d-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-f1d-diagnosis-evidence
          path: |
            atlas-f1d-inputs.log
            atlas-f1d-test.log
            atlas-f1d-summary.txt
            atlas-f1d-gofmt.diff
            atlas-f1d-raw/**
            nats/server/atlas_extreme_01_diagnostic_test.go
          if-no-files-found: warn
          retention-days: 14
