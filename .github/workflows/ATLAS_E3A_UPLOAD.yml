# ATLAS E3-A: REAL 5-node NATS baseline. No NATS product code changes.
# Does NOT reproduce nats-io/nats-server #7556 or prove an orphan race.
# Frozen original source commit d163ae747ad050ea89054f8fb03c43e64e737aea
name: ATLAS NATS E3A Five Node Generation Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-node-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: auto
      TEST: TestAtlasE3AClusterGenerationBaseline
    steps:
      - name: Checkout frozen original NATS
        uses: actions/checkout@v4
        with:
          repository: nats-io/nats-server
          ref: d163ae747ad050ea89054f8fb03c43e64e737aea
          fetch-depth: 1
          path: nats
      - name: Set up Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore additive test and verify frozen product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C nats rev-parse HEAD)" = d163ae747ad050ea89054f8fb03c43e64e737aea
          test "$(git -C nats hash-object server/jetstream_cluster.go)" = d4f7f413367d9f3c122955ce99e9e10da5b8214c
          test "$(git -C nats hash-object server/stream.go)" = 685758e51460493aebe2d8db679983a0da259bf7
          test "$(git -C nats hash-object server/filestore.go)" = acee437a0ff4dfb80197f288a78df4108f4db24b
          test -z "$(git -C nats status --porcelain)"
          mkdir -p atlas-e3a-raw
