      - name: Run E2B single healthy five-server test
        id: run
        working-directory: nats
        env:
          ATLAS_E2B_EVIDENCE_DIR: ${{ github.workspace }}/atlas-e2b-raw
        shell: bash
        run: |
          set +e
          set -o pipefail
          go test ./server -run '^TestAtlasE2BHealthyMetaSnapshotCatchup$' -count=1 -timeout=18m -covermode=atomic -coverprofile=../atlas-e2b-coverage.out -v 2>&1 | tee ../atlas-e2b-test.log
          rc=${PIPESTATUS[0]}
          echo "GO_TEST_EXIT=$rc" | tee -a ../atlas-e2b-test.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Audit target local metadata and orphan candidates
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee atlas-e2b-audit.txt
          from pathlib import Path
          import re,hashlib,sys
          log=Path('atlas-e2b-test.log')
          s=log.read_text(errors='replace') if log.exists() else ''
          print('ATLAS_E2B_PROOF_SCOPE=single_run_healthy_five_server_no_delete_no_corruption')
          print('ATLAS_E2B_TEST_SHA256=9122949b8538371bd7220218efc45783cff94ad381e2bbc6f2283df7eeaac015')
          pass_test='--- PASS: TestAtlasE2BHealthyMetaSnapshotCatchup' in s and 'GO_TEST_EXIT=0' in s
          transfer=re.search(r'ATLAS_E2B_TRANSFER_PROOF .*?sender_need_snapshot_events=([0-9]+).*?receiver_index_verified=true.*?payload_identical=true',s)
          assignments=re.findall(r'ATLAS_E2B_LOCAL_META_ASSIGNMENT .*?stream=(\w+).*?consistent=(true|false)',s)
          matched={stream for stream,ok in assignments if ok=='true'}
          expected={'ATLAS','E2BSIDE0','E2BSIDE1','E2BSIDE2'}
          orphan=re.search(r'ATLAS_E2B_ORPHAN_CANDIDATES_AFTER_SNAPSHOT .*?zero_candidates=true',s)
          target=re.search(r'ATLAS_E2B_VERDICT=TARGET_LOCAL_META_APPLICATION_AND_NO_ORPHAN_CANDIDATES',s)
          observed={'original_test_pass':pass_test,'snapshot_transfer':bool(transfer) and int(transfer.group(1))>0,
                   'target_local_four_assignments':expected.issubset(matched),'no_orphan_candidates_at_sample':bool(orphan),
                   'explicit_e2b_success_verdict':bool(target)}
          for label,ok in observed.items(): print('ATLAS_E2B_CHECK=%s pass=%s'%(label,str(ok).lower()))
          print('ATLAS_E2B_LIMIT=snapshot_orphan_candidates_sampled_post_recovery_not_inside_deletion_call')
          print('ATLAS_E2B_LIMIT=absence_of_erroneous_removal_in_this_healthy_case_not_general_safety')
          print('ATLAS_E2B_LIMIT=original_NATS_issue_7556_not_reproduced')
          print('ATLAS_E2B_AUDIT_VERDICT='+('HEALTHY_LOCAL_META_AND_NO_ORPHAN_CANDIDATES_PROVEN' if all(observed.values()) else 'BLOCKED_OR_FAIL'))
          if not all(observed.values()):sys.exit(3)
          PY

      - name: Hash collected original artifacts
        if: always()
        shell: bash
        run: |
          {
            echo "=== exact test and audit ==="
            grep -E 'ATLAS_E2B_(TRANSFER_PROOF|LOCAL_META_ASSIGNMENT|ORPHAN_CANDIDATES_AFTER_SNAPSHOT|METADATA_APPLICATION|VERDICT)|GO_TEST_EXIT' atlas-e2b-test.log 2>/dev/null || true
            test -f atlas-e2b-audit.txt && cat atlas-e2b-audit.txt || true
            echo "=== toolchain and frozen original ==="
            cat atlas-e2b-inputs.txt 2>/dev/null || true
          } | tee atlas-e2b-summary.txt
          find atlas-e2b-raw -type f -print 2>/dev/null | sort | while read -r file; do sha256sum "$file"; done > atlas-e2b-raw-sha256.txt
          sha256sum atlas-e2b-inputs.txt atlas-e2b-test.log atlas-e2b-audit.txt atlas-e2b-summary.txt nats/server/atlas_e2b_meta_decision_test.go > atlas-e2b-evidence-sha256.txt 2>/dev/null || true
          cat atlas-e2b-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve all original evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-nats-e2b-target-local-meta-evidence
          path: |
            atlas-e2b-inputs.txt
            atlas-e2b-test.log
            atlas-e2b-coverage.out
            atlas-e2b-audit.txt
            atlas-e2b-summary.txt
            atlas-e2b-evidence-sha256.txt
            atlas-e2b-raw-sha256.txt
            atlas-e2b-gofmt.diff
            atlas-e2b-raw/**
            nats/server/atlas_e2b_meta_decision_test.go
          if-no-files-found: warn
          retention-days: 14
