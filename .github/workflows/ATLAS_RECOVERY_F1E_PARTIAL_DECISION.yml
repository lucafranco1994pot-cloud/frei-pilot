name: ATLAS Recovery F1E partial-decision boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f1e-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned SDK
        run: |
          python -m pip install 'git+https://github.com/openai/openai-agents-python.git@e355d69152d4f4730dfb03b63dbce53e8d9f5d8c'
          python -m pip show openai-agents > sdk.txt
          python -m pip freeze > dependencies.txt
      - name: D N NR and N2 progressive decision probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > probe.py <<'ATLAS_F1E_SCRIPT'
          import asyncio, hashlib, json, sqlite3, sys, traceback
          from pathlib import Path
          from agents import Agent, Runner, RunConfig
          from agents.decorators import tool
          from agents.testing import ScriptedModel, function_call, assistant_message
          from agents.tool_guardrails import (tool_input_guardrail, tool_output_guardrail,
              ToolGuardrailFunctionOutput)
          
          CASES=('D','N','NR','N2')
          
          def store(path,sql,values=()):
              with sqlite3.connect(path) as db:
                  return db.execute(sql,values).fetchall()
          
          def dump(value):
              return value.model_dump(mode='json') if hasattr(value,'model_dump') else value
          
          def calls(result):
              return [{'agent':getattr(i.agent,'name',None),'tool':i.tool_name,
                       'id':getattr(i.raw_item,'call_id',None),
                       'arguments':getattr(i.raw_item,'arguments',None)} for i in result]
          
          async def run_case(case):
              base=Path('proof')/case; base.mkdir(parents=True,exist_ok=True)
              effects=base/'effects.db'; history=base/'session.db'
              store(effects,'CREATE TABLE events (id INTEGER PRIMARY KEY,kind TEXT)')
              store(history,'CREATE TABLE items (id INTEGER PRIMARY KEY,body TEXT)')
              store(history,'CREATE TABLE batches (id INTEGER PRIMARY KEY,body TEXT)')
              def mark(tag):store(effects,'INSERT INTO events(kind) VALUES (?)',(tag,))
              def count():return dict(store(effects,'SELECT kind,count(*) FROM events GROUP BY kind'))
          
              class SQLiteSession:
                  session_id='atlas-f1-diagnostic-'+case
                  async def get_items(self,limit=None):
                      records=[json.loads(x[0]) for x in store(history,'SELECT body FROM items ORDER BY id')]
                      return records[-limit:] if limit is not None else records
                  async def add_items(self,items):
                      records=[dump(x) for x in items]
                      with sqlite3.connect(history) as db:
                          db.execute('INSERT INTO batches(body) VALUES (?)',(json.dumps(records),))
                          db.executemany('INSERT INTO items(body) VALUES (?)',
                              [(json.dumps(x),) for x in records])
                  async def pop_item(self):
                      with sqlite3.connect(history) as db:
                          row=db.execute('SELECT id,body FROM items ORDER BY id DESC LIMIT 1').fetchone()
                          if row:db.execute('DELETE FROM items WHERE id=?',(row[0],))
                      return json.loads(row[1]) if row else None
                  async def clear_session(self):store(history,'DELETE FROM items')
          
              @tool_input_guardrail
              async def check_input(_):
                  mark('guardrail_input_A'); return ToolGuardrailFunctionOutput.allow()
              @tool_output_guardrail
              async def check_output(_):
                  mark('guardrail_output_A'); return ToolGuardrailFunctionOutput.allow()
              @tool(needs_approval=True,tool_input_guardrails=[check_input],
                    tool_output_guardrails=[check_output])
              async def action_a()->str:
                  """Record an approved harmless action A."""
                  mark('executor_A');mark('effect_A');return 'receipt-A'
              @tool(needs_approval=True)
              async def action_b()->str:
                  """Record a separate harmless action B."""
                  mark('executor_B');mark('effect_B');return 'receipt-B'
          
              model=ScriptedModel([
                  [function_call('action_a',{},call_id='inner-A'),
                   function_call('action_b',{},call_id='inner-B')],
                  [assistant_message('inner done')]])
              child=Agent(name='subordinate',model=model,tools=[action_a,action_b])
              outer_model=None
              session=SQLiteSession();cfg=RunConfig(tracing_disabled=True)
              if case=='D':
                  agent=child
              else:
                  outer_model=ScriptedModel([
                      [function_call('delegate',{'input':'run'},call_id='outer-1')],
                      [assistant_message('outer done')]])
                  agent=Agent(name='main',model=outer_model,tools=[
                      child.as_tool(tool_name='delegate',tool_description='Nested test',
                                    session=session,failure_error_function=None)])
          
              report={'case':case,'sdk_commit':'e355d69152d4f4730dfb03b63dbce53e8d9f5d8c',
                      'phase':'INIT','status':'NOT_EVALUABLE','first':[],'current':[],
                      'after_decision':[],'after_resume':[], 'failure':None}
              try:
                  first=await Runner.run(agent,'start',session=session if case=='D' else None,
                                         run_config=cfg)
                  report['phase']='PAUSED';report['first']=calls(first.interruptions)
                  state=first.to_state()
                  report['current']=calls(state.get_interruptions())
                  ids=[x['id'] for x in report['current']]
                  if sorted(ids)!=['inner-A','inner-B']:
                      raise AssertionError('Current state lacks distinct A and B interruptions: '+str(ids))
                  a=next(i for i in state.get_interruptions()
                         if getattr(i.raw_item,'call_id',None)=='inner-A')
                  state.approve(a)
                  if case=='NR':
                      b=next(i for i in state.get_interruptions()
                             if getattr(i.raw_item,'call_id',None)=='inner-B')
                      state.reject(b,rejection_message='declined by reviewer')
                  report['phase']='DECIDED'
                  # Diagnostic-only: inspect decision binding, never alter approval records.
                  def decision_binding(item):
                      from agents.run_context import RunContextWrapper
                      owner = state._find_nested_approval_state(item)
                      target, owned_item = owner if owner is not None else (state, item)
                      namespace=RunContextWrapper._resolve_tool_namespace(owned_item)
                      call_id=getattr(owned_item.raw_item,'call_id',None)
                      c=getattr(target,'_context',None)
                      value=(c.get_approval_status(owned_item.tool_name or '',call_id,
                           tool_namespace=namespace,existing_pending=owned_item)
                           if c is not None and call_id else None)
                      return {'owner':'nested' if owner is not None else 'outer',
                              'decision':value, 'call_id':call_id,
                              'namespace':namespace}
                  report['decision_binding']={
                      x:getattr(state,'_current_step',None) is not None and
                        decision_binding(next(i for i in state.get_interruptions()
                          if getattr(i.raw_item,'call_id',None)==('inner-'+x)))
                      for x in ('A','B')}
                  report['after_decision']=calls(state.get_interruptions())
                  report['decision_state_sha256']=hashlib.sha256(
                      json.dumps(state.to_json(),sort_keys=True,default=str).encode()).hexdigest()
                  report['phase']='RESUMING'
                  result=await Runner.run(agent,state,session=session if case=='D' else None,
                                          run_config=cfg)
                  report['phase']='RESUMED';report['after_resume']=calls(result.interruptions)
                  report['final_output']=result.final_output
                  report['public_tool_input_results']=len(result.tool_input_guardrail_results)
                  report['public_tool_output_results']=len(result.tool_output_guardrail_results)
              except Exception as exc:
                  report['failure']={'type':type(exc).__name__,'message':str(exc),
                                    'traceback':traceback.format_exc()[-2600:]}
              rows=store(history,'SELECT body FROM items ORDER BY id')
              batch_rows=store(history,'SELECT body FROM batches ORDER BY id')
              items=[json.loads(row[0]) for row in rows]
              batches=[json.loads(row[0]) for row in batch_rows]
              def types(call_id):
                  return [x.get('type') for x in items if isinstance(x,dict)
                          and x.get('call_id')==call_id]
              report.update({'counters':count(),'session_a':types('inner-A'),
                             'session_b':types('inner-B'),
                             'batch_count':len(batches),
                             'batch_a_output_count':sum(1 for batch in batches for x in batch
                                 if isinstance(x,dict) and x.get('call_id')=='inner-A'
                                 and x.get('type')=='function_call_output'),
                             'inner_model_calls':len(model.calls),
                             'outer_model_calls':len(outer_model.calls) if outer_model else None})
              c=report['counters']
              report['checks']={
                'A_executor_once':c.get('executor_A',0)==1,
                'A_effect_once':c.get('effect_A',0)==1,
                'B_never_executed':c.get('executor_B',0)==c.get('effect_B',0)==0,
                'A_guardrails_once':c.get('guardrail_input_A',0)==c.get('guardrail_output_A',0)==1,
                'A_output_persisted_once':report['session_a'].count('function_call_output')==1,
                'A_output_in_write_batch_once':report['batch_a_output_count']==1,
                'expected_pending': ([x['id'] for x in report['after_resume']]==(['inner-B'] if case!='NR' else [])),
                'expected_model_calls':(report['inner_model_calls']==(2 if case=='NR' else 1)
                    and (case=='D' or report['outer_model_calls']==(2 if case=='NR' else 1))),
                'no_exception':report['failure'] is None,
              }
              report['status']=('NOT_EVALUABLE' if report['failure'] is not None or
                  report['phase']!='RESUMED' else
                  'PASS' if all(report['checks'].values()) else 'OBSERVED_DEVIATION')
              if case=='N2' and report['phase']=='RESUMED' and report['failure'] is None:
                  # Follow the same outer RunState through a second review decision.
                  try:
                      pending=report['after_resume']
                      if [x['id'] for x in pending]!=['inner-B']:
                          raise AssertionError('N2 requires exactly B pending at second boundary')
                      second_state=result.to_state()
                      second_b=next(i for i in second_state.get_interruptions()
                        if getattr(i.raw_item,'call_id',None)=='inner-B')
                      second_state.reject(second_b,rejection_message='declined on second review')
                      second=await Runner.run(agent,second_state,run_config=cfg)
                      c2=count()
                      final_items=[json.loads(r[0]) for r in store(history,
                        'SELECT body FROM items ORDER BY id')]
                      report['second_resume']={
                        'counters':c2,'pending':calls(second.interruptions),
                        'final_output':second.final_output,
                        'inner_model_calls':len(model.calls),
                        'outer_model_calls':len(outer_model.calls),
                        'session_a_output_count':sum(x.get('call_id')=='inner-A' and
                           x.get('type')=='function_call_output' for x in final_items
                           if isinstance(x,dict)),
                        'session_b_rejection_count':sum(x.get('call_id')=='inner-B' and
                           x.get('type')=='function_call_output' for x in final_items
                           if isinstance(x,dict))}
                      s=report['second_resume']
                      s['status']='PASS' if (c2.get('effect_A',0)==1 and
                          c2.get('effect_B',0)==0 and
                          s['session_a_output_count']==1 and
                          s['session_b_rejection_count']==1 and
                          not s['pending'] and s['final_output']=='outer done') else 'OBSERVED_DEVIATION'
                  except Exception as e:
                      report['second_resume']={'status':'NOT_EVALUABLE',
                          'error':type(e).__name__,'message':str(e),
                          'traceback':traceback.format_exc()[-2600:]}
              (base/'result.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
              print(json.dumps({'case':case,'status':report['status'], 'phase':report['phase'],
                    'counters':c,'pending':[x['id'] for x in report['after_resume']],
                    'model_calls':report['inner_model_calls'],
                              'second':report.get('second_resume',{}).get('status'),
                    'failure':report['failure']['type'] if report['failure'] else None}))
          
          def verify():
              docs=[json.loads((Path('proof')/c/'result.json').read_text()) for c in CASES]
              statuses={v['case']:v['status'] for v in docs}
              valid=all(v['case']==c and v['phase']=='RESUMED' and v['failure'] is None
                        and sorted(x['id'] for x in v['first'])==['inner-A','inner-B']
                        and v.get('decision_binding',{}).get('A',{}).get('decision') is True
                        for c,v in zip(CASES,docs))
              valid=valid and statuses['D']=='PASS' and statuses['NR']=='PASS'
              second=docs[3].get('second_resume',{})
              if not valid or second.get('status')=='NOT_EVALUABLE':
                  classification='NOT_EVALUABLE'
              elif statuses['N']=='PASS':
                  classification='NO_PARTIAL_GAP_REPRODUCED'
              elif statuses['N']=='OBSERVED_DEVIATION' and second.get('status')=='PASS':
                  classification='APPROVED_A_DEFERRED_UNTIL_B_DECISION'
              elif statuses['N']=='OBSERVED_DEVIATION' and second.get('status')=='OBSERVED_DEVIATION':
                  classification='PARTIAL_RESUME_AND_RECOVERY_GAP_CANDIDATE'
              else:
                  classification='UNCLASSIFIED_CONTRADICTION'
              final={'classification':classification,'statuses':statuses,
                     'second_resume_status':second.get('status','MISSING'),
                     'decision_bindings':{d['case']:d.get('decision_binding') for d in docs},
                     'sdk_commit':'e355d69152d4f4730dfb03b63dbce53e8d9f5d8c',
                     'new_bug_confirmed':False,'no_external_side_effects':True,
                     'next_step':'Only investigate SDK ownership gate if control and second-stage proof are evaluable'}
              Path('proof/summary.json').write_text(json.dumps(final,indent=2,sort_keys=True)+'\n')
              print('ATLAS_F1E_DIAGNOSTIC',json.dumps(final,sort_keys=True))
              return 0 if classification in {
                    'NO_PARTIAL_GAP_REPRODUCED',
                    'APPROVED_A_DEFERRED_UNTIL_B_DECISION',
                    'PARTIAL_RESUME_AND_RECOVERY_GAP_CANDIDATE'} else 2
          
          if __name__=='__main__':
              arg=sys.argv[1] if len(sys.argv)>1 else None
              if arg in CASES:asyncio.run(run_case(arg))
              elif arg=='verify':raise SystemExit(verify())
              else:raise SystemExit('Usage: probe.py D|N|NR|N2|verify')
          ATLAS_F1E_SCRIPT
          python -m py_compile probe.py
          for case in D N NR N2; do
            python probe.py "$case" | tee "proof/$case-output.log"
          done
          python probe.py verify
      - name: SHA-256 integrity
        if: always()
        shell: bash
        run: |
          find proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum probe.py sdk.txt dependencies.txt >> SHA256SUMS
      - name: Publish proof even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-recovery-f1e-partial-decision
          path: |
            probe.py
            proof/
            sdk.txt
            dependencies.txt
            SHA256SUMS
          if-no-files-found: warn
